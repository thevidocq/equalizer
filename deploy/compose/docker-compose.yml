# Equalizer — prototype on a VPS.
# Networks:
#   edge     exposed: edge proxy (Caddy) and tunnel-relay (behind Caddy)
#   control  internal: gateway, observability, panel (later)
#   lab      internal, with no way out to the Internet: test apps
# Start: docker compose up -d   (see INSTALL.md)

name: equalizer

networks:
  edge: {}
  control: {}
  lab:
    internal: true

volumes:
  caddy-data: {}
  loki-data: {}
  grafana-data: {}
  vector-data: {}

x-collect: &collect
  labels:
    eq.collect: "true"

services:
  caddy:
    image: caddy:2.8
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      EQ_GATEWAY_DOMAIN: ${EQ_GATEWAY_DOMAIN:?set EQ_GATEWAY_DOMAIN in .env}
      EQ_RELAY_DOMAIN: ${EQ_RELAY_DOMAIN:?set EQ_RELAY_DOMAIN in .env}
      EQ_ACME_EMAIL: ${EQ_ACME_EMAIL:-}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    networks: [edge]
    depends_on: [gateway, tunnel-relay]

  gateway:
    <<: *collect
    build:
      context: ../../gateway
      args:
        VERSION: ${EQ_VERSION:-dev}
    restart: unless-stopped
    deploy:
      replicas: ${EQ_GATEWAY_REPLICAS:-2}
    environment:
      EQ_PUBLIC_ADDR: ":8080"
      EQ_ADMIN_ADDR: ":9090"
      EQ_LOG_LEVEL: ${EQ_LOG_LEVEL:-info}
      EQ_MAP_FILE: /maps/current.json
      EQ_MAP_PUBKEY_FILE: /secrets/map-signing.pub
      EQ_MAP_KEY_ID: ${EQ_MAP_KEY_ID:-k1}
      # shared by every replica: a form rendered by one is accepted by the others
      EQ_FORM_KEY_FILE: /secrets/form.key
      # connector mode: requests go to tunnel-relay on the control network
      EQ_RELAY_URL: http://tunnel-relay:8082
      EQ_RELAY_TOKEN_FILE: /secrets/relay.token
      # edge network: only Caddy may state the client IP
      EQ_TRUSTED_PROXIES: ${EQ_TRUSTED_PROXIES:-172.16.0.0/12}
    volumes:
      - ./maps:/maps:ro
      - ./secrets/map-signing.pub:/secrets/map-signing.pub:ro
      - ./secrets/form.key:/secrets/form.key:ro
      - ./secrets/relay.token:/secrets/relay.token:ro
    networks: [edge, control]

  tunnel-relay:
    <<: *collect
    build:
      context: ../../tunnel-relay
      args:
        VERSION: ${EQ_VERSION:-dev}
    restart: unless-stopped
    # One replica: a tunnel lives on one relay instance (see CHANGELOG).
    environment:
      EQ_TUNNEL_ADDR: ":8081"
      EQ_INTERNAL_ADDR: ":8082"
      EQ_ADMIN_ADDR: ":9091"
      EQ_LOG_LEVEL: ${EQ_LOG_LEVEL:-info}
      EQ_CONNECTORS_FILE: /secrets/connectors.json
      EQ_GATEWAY_TOKEN_FILE: /secrets/relay.token
    volumes:
      - ./secrets/connectors.json:/secrets/connectors.json:ro
      - ./secrets/relay.token:/secrets/relay.token:ro
    # edge: Caddy brings the connectors' tunnels; control: the gateway calls it
    networks: [edge, control]

  loki:
    image: grafana/loki:3.1.1
    restart: unless-stopped
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./loki/config.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    networks: [control]

  vector:
    image: timberio/vector:0.40.1-alpine
    restart: unless-stopped
    command: ["--config", "/etc/vector/vector.yaml"]
    volumes:
      - ./vector/vector.yaml:/etc/vector/vector.yaml:ro
      # read-only: Vector reads logs of containers labelled eq.collect
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - vector-data:/var/lib/vector
    networks: [control]
    depends_on: [loki]

  grafana:
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${EQ_GRAFANA_PASSWORD:?set EQ_GRAFANA_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    # VPS localhost only: reach it over an SSH tunnel or VPN
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    networks: [control]
    depends_on: [loki]

  eqtool:
    build: ../../tools
    profiles: [tools]
    # writes files as the VPS user, not as root
    user: "${EQ_UID:-1000}:${EQ_GID:-1000}"
    volumes:
      - ./:/work
    network_mode: none
