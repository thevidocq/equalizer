name: publish

# Publishes the images to GitHub Container Registry on every merge to main,
# so the connector can be installed with a plain `docker run`.
on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [gateway, tunnel-relay, connector, panel-api, panel-ui, tools, agent]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        run: |
          name=${{ matrix.service }}
          [ "$name" = tools ] && name=eqtool
          image=ghcr.io/${{ github.repository_owner }}/equalizer-$name
          docker build --build-arg VERSION=${GITHUB_SHA::12} -t "$image:latest" -t "$image:${GITHUB_SHA::12}" ${{ matrix.service }}
          docker push "$image:latest"
          docker push "$image:${GITHUB_SHA::12}"
