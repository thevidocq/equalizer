openapi: 3.1.0
info:
  title: Equalizer panel-api
  version: 0.2.0
  description: |
    Control-plane API. Used by panel-ui (people: panel session cookie) and
    by internal services (service tokens on /internal). Implemented so
    far: auth, tenants, users, apps, connectors, maps, internal, audit.
    The other sections describe planned endpoints and keep brief bodies.

    Every request that changes state must carry the header
    `X-Eq-Panel: 1` (CSRF barrier together with SameSite=Strict cookies).

    Privacy between platform and tenants: platform users (who run the
    service) manage tenants and see only /platform/tenants (tenant and site
    names, counts, status). Everything inside a tenant (sites' domains,
    maps, connectors, people, activity) is visible only to that tenant's
    people. Tenant people join by email invitation and choose their own
    password: nobody else ever knows it.

    Two-step login: a password login opens a session limited to /auth/*
    until /auth/mfa/verify (or, the first time, /auth/mfa/setup and
    /auth/mfa/enable) succeeds.
servers:
  - url: /v1
security:
  - panelSession: []
tags:
  - name: auth
  - name: tenants
  - name: users
  - name: apps
  - name: internal
  - name: maps
  - name: discovery
  - name: connectors
  - name: capacity
  - name: llm
  - name: metrics
  - name: status
  - name: logs
  - name: siem
  - name: import-export
  - name: audit
paths:
  /auth/login:
    post:
      tags: [auth]
      summary: Log in with email and password; sets the panel session cookie
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /auth/logout:
    post:
      tags: [auth]
      summary: End the panel session
      responses:
        "204": { description: Logged out }
  /auth/me:
    get:
      tags: [auth]
      summary: The logged-in user
      responses:
        "200":
          description: User
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Error" }
  /auth/mfa/setup:
    post:
      tags: [auth]
      summary: Start (or restart) the enrolment of an authenticator app; the secret is active only after /auth/mfa/enable
      responses:
        "200":
          description: Secret to add to the authenticator app
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MfaSetup" }
        "409": { $ref: "#/components/responses/Error" }
  /auth/mfa/enable:
    post:
      tags: [auth]
      summary: Confirm the enrolment with a code from the app; returns the recovery codes, shown once
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MfaCode" }
      responses:
        "200":
          description: Recovery codes
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RecoveryCodes" }
        "400": { $ref: "#/components/responses/Error" }
  /auth/mfa/verify:
    post:
      tags: [auth]
      summary: Second step of the login, with a code from the app or a recovery code; the session id changes
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MfaCode" }
      responses:
        "200":
          description: User
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "400": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /auth/password:
    post:
      tags: [auth]
      summary: Change one's own password; the other sessions of the user end
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [current_password, new_password]
              properties:
                current_password: { type: string, maxLength: 256, writeOnly: true }
                new_password: { type: string, minLength: 12, maxLength: 256, writeOnly: true }
      responses:
        "204": { description: Password changed }
        "400": { $ref: "#/components/responses/Error" }
  /auth/password-reset:
    post:
      tags: [auth]
      summary: "Forgotten password: emails a link valid for one hour to the account, if one exists; the answer is the same either way"
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email]
              properties:
                email: { type: string, format: email, maxLength: 254 }
      responses:
        "202": { description: "If the account exists, the email is on its way" }
        "429": { $ref: "#/components/responses/Error" }
  /auth/password-reset/{token}:
    get:
      tags: [auth]
      summary: Whether a reset link still works (public, the token is the secret)
      security: []
      parameters: [{ name: token, in: path, required: true, schema: { type: string, maxLength: 64 } }]
      responses:
        "204": { description: The link works }
        "404": { $ref: "#/components/responses/Error" }
    post:
      tags: [auth]
      summary: Choose a new password with a reset link; every session of the user ends. The authenticator stays as it is
      security: []
      parameters: [{ name: token, in: path, required: true, schema: { type: string, maxLength: 64 } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, minLength: 12, maxLength: 256, writeOnly: true }
      responses:
        "204": { description: Password changed }
        "400": { $ref: "#/components/responses/Error" }
        "404": { $ref: "#/components/responses/Error" }
  /tenants/{tenant}/users/{id}:
    delete:
      tags: [users]
      summary: Deactivate a person; their sessions end
      parameters: [{ $ref: "#/components/parameters/tenant" }, { $ref: "#/components/parameters/id" }]
      responses:
        "204": { description: Deactivated }
        "404": { $ref: "#/components/responses/Error" }
  /tenants/{tenant}/users/{id}/reset-mfa:
    post:
      tags: [users]
      summary: Remove a person's authenticator (lost phone); they enrol again at the next login
      parameters: [{ $ref: "#/components/parameters/tenant" }, { $ref: "#/components/parameters/id" }]
      responses:
        "204": { description: Reset }
        "404": { $ref: "#/components/responses/Error" }
  /tenants:
    get:
      tags: [tenants]
      summary: "The user's own tenant; for platform users, every tenant (id and name only)"
      responses:
        "200":
          description: Tenants
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Tenant" } }
                  next_cursor: { type: [string, "null"] }
    post:
      tags: [tenants]
      summary: >-
        Create a tenant and email an invitation to its first administrator (platform administrators). 409 when the
        id exists or the email already has an account or a pending invitation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TenantCreate" }
      responses:
        "201":
          description: Tenant created, invitation sent
          content:
            application/json:
              schema:
                type: object
                required: [tenant, invitation]
                properties:
                  tenant: { $ref: "#/components/schemas/Tenant" }
                  invitation: { $ref: "#/components/schemas/Invitation" }
        "409": { $ref: "#/components/responses/Error" }
  /tenants/{tenant}/users:
    get:
      tags: [users]
      summary: Users of a tenant
      parameters: [{ $ref: "#/components/parameters/tenant" }]
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/User" } }
                  next_cursor: { type: [string, "null"] }
  /tenants/{tenant}/invitations:
    get:
      tags: [users]
      summary: Pending invitations of the tenant (tenant administrators)
      parameters: [{ $ref: "#/components/parameters/tenant" }]
      responses:
        "200":
          description: Invitations
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Invitation" } }
                  next_cursor: { type: [string, "null"] }
    post:
      tags: [users]
      summary: >-
        Invite a person by email; they choose their own password (tenant administrators). 409 when the email already
        has an account or a pending invitation
      parameters: [{ $ref: "#/components/parameters/tenant" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InvitationCreate" }
      responses:
        "201":
          description: Invitation sent
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invitation" }
        "409": { $ref: "#/components/responses/Error" }
  /tenants/{tenant}/invitations/{id}:
    delete:
      tags: [users]
      summary: Revoke a pending invitation
      parameters: [{ $ref: "#/components/parameters/tenant" }, { $ref: "#/components/parameters/id" }]
      responses:
        "204": { description: Revoked }
        "404": { $ref: "#/components/responses/Error" }
  /invitations/{token}:
    get:
      tags: [users]
      summary: What an invitation is for (public, the token is the secret)
      security: []
      parameters: [{ name: token, in: path, required: true, schema: { type: string, maxLength: 64 } }]
      responses:
        "200":
          description: Invitation
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvitationView" }
        "404": { $ref: "#/components/responses/Error" }
  /invitations/{token}/accept:
    post:
      tags: [users]
      summary: Accept an invitation by choosing a password; opens a session that continues with the authenticator setup
      security: []
      parameters: [{ name: token, in: path, required: true, schema: { type: string, maxLength: 64 } }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [password]
              properties:
                password: { type: string, minLength: 12, maxLength: 256, writeOnly: true }
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "404": { $ref: "#/components/responses/Error" }
  /platform/tenants:
    get:
      tags: [tenants]
      summary: "Platform view: every tenant with its sites' names and status, nothing of their configuration (platform users)"
      responses:
        "200":
          description: Tenants
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/TenantOverview" } }
                  next_cursor: { type: [string, "null"] }
  /platform/tenants/{tenant}:
    delete:
      tags: [tenants]
      summary: >-
        Delete a customer and everything it owns: sites and their maps (the gateways drop them), connectors (their
        tunnels close), people, invitations, settings and activity. Traffic logs expire on their own. The body repeats
        the tenant's id (platform administrators)
      parameters: [{ $ref: "#/components/parameters/tenant" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [confirm]
              properties:
                confirm: { type: string, description: "The tenant's id, typed again" }
      responses:
        "204": { description: Deleted }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /platform/tenants/{tenant}/invitation:
    post:
      tags: [tenants]
      summary: >-
        Invite the first administrator again (lost or unsent email, wrong address). Pending invitations
        are revoked. 409 once anyone has joined the tenant, or when the email already has an account or a pending
        invitation elsewhere (platform administrators)
      parameters: [{ $ref: "#/components/parameters/tenant" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [admin_email, admin_name]
              properties:
                admin_email: { type: string, format: email }
                admin_name: { type: string, minLength: 1, maxLength: 200 }
      responses:
        "201":
          description: Invitation created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Invitation" }
        "404": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /tenants/{tenant}/apps:
    get:
      tags: [apps]
      summary: Protected sites of a tenant
      parameters: [{ $ref: "#/components/parameters/tenant" }]
      responses:
        "200":
          description: Sites
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/App" } }
                  next_cursor: { type: [string, "null"] }
    post:
      tags: [apps]
      summary: Protect a new site
      parameters: [{ $ref: "#/components/parameters/tenant" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppCreate" }
      responses:
        "201":
          description: Site created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/App" }
        "409": { $ref: "#/components/responses/Error" }
  /apps/{app}:
    get:
      tags: [apps]
      summary: A protected site
      parameters: [{ $ref: "#/components/parameters/app" }]
      responses:
        "200":
          description: Site
          content:
            application/json:
              schema: { $ref: "#/components/schemas/App" }
        "404": { $ref: "#/components/responses/Error" }
    patch:
      tags: [apps]
      summary: Change site settings (tenant administrators)
      parameters: [{ $ref: "#/components/parameters/app" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                discovery_schedule: { enum: [off, daily, weekly] }
                public_scheme:
                  enum: [https, http]
                  description: "https: the site's own certificate (Certificate); http: in clear, as the legacy site was. Applied at once to the published map, which is signed again"
                legacy_ip:
                  type: [string, "null"]
                  description: "Public IP the site answered on before Equalizer: the exposure check probes it. A public unicast IPv4 or IPv6 address (a port is ignored), not Equalizer's own; null stops the checks"
                never_public:
                  type: boolean
                  description: "true: the site never had a public address (it was born behind Equalizer), so there is nothing to probe: Isolation is shown as fine. Clears legacy_ip. false: back to not_configured"
      responses:
        "200":
          description: Site
          content:
            application/json:
              schema: { $ref: "#/components/schemas/App" }
        "422": { $ref: "#/components/responses/Error" }
  /apps/{app}/aliases:
    put:
      tags: [apps]
      summary: >-
        Other domains of the site (e.g. the bare domain next to www): the gateway takes a certificate for them and
        redirects them (301) to the public domain. Applied at once to the published map, which is signed again
        (tenant administrators)
      parameters: [{ $ref: "#/components/parameters/app" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [aliases]
              properties:
                aliases: { type: array, maxItems: 10, items: { type: string, maxLength: 253 } }
      responses:
        "200":
          description: Site
          content:
            application/json:
              schema: { $ref: "#/components/schemas/App" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /apps/{app}/certificate:
    put:
      tags: [apps]
      summary: >-
        Upload the site's own certificate (the legacy site's, never a new one): PEM (certificate, chain and private
        key) or PKCS#12 (.pfx, as IIS exports it) with its password. Checked before it is kept: the key matches, the
        chain is complete, it covers the public domain and the other domains, it is valid now. The private key is
        stored encrypted and never returned. Applies at once; the tenant administrators get an email (tenant
        administrators)
      parameters: [{ $ref: "#/components/parameters/app" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                pem: { type: string, maxLength: 200000, description: "Certificate, chain and private key, PEM blocks in any order" }
                pfx: { type: string, maxLength: 300000, description: "PKCS#12 file in base64" }
                password: { type: string, maxLength: 1000, description: "Password of the .pfx or of an encrypted PEM key" }
      responses:
        "200":
          description: Site with its certificate
          content:
            application/json:
              schema: { $ref: "#/components/schemas/App" }
        "422": { $ref: "#/components/responses/Error" }
    delete:
      tags: [apps]
      summary: Remove the site's certificate (HTTPS stops for the site) (tenant administrators)
      parameters: [{ $ref: "#/components/parameters/app" }]
      responses:
        "200":
          description: Site
          content:
            application/json:
              schema: { $ref: "#/components/schemas/App" }
  /apps/{app}/exposure/check:
    post:
      tags: [apps]
      summary: >-
        Check now whether the site still answers directly on its old public IP (ports 443 and 80, with its name in
        TLS SNI and Host). At most once a minute per site (tenant administrators)
      parameters: [{ $ref: "#/components/parameters/app" }]
      responses:
        "200":
          description: Site with the new result
          content:
            application/json:
              schema: { $ref: "#/components/schemas/App" }
        "409": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /map-templates:
    get:
      tags: [maps]
      summary: Starting maps for common CMS (WordPress, Joomla, Drupal, Moodle) and generic sites
      responses:
        "200":
          description: Templates
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/MapTemplate" } }
  /apps/{app}/map-template:
    post:
      tags: [maps]
      summary: >-
        A first map for the site from a template, filled with its domain, connector and address. Nothing is
        saved: the document goes into the editor and becomes a draft like any other (administrators)
      parameters: [{ $ref: "#/components/parameters/app" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [template, connector_id, address]
              properties:
                template: { type: string }
                connector_id: { type: string, pattern: "^[a-z0-9][a-z0-9_-]{1,62}$" }
                address: { type: string, pattern: "^[A-Za-z0-9.\\-]+:[0-9]{1,5}$", description: "host:port the connector connects to" }
                scheme: { enum: [https, http], default: https }
                max_upload_mb:
                  type: integer
                  minimum: 1
                  maximum: 1024
                  default: 50
                  description: Largest request body the site accepts, uploads included, and largest file served from upload folders
      responses:
        "200":
          description: Map document
          content:
            application/json:
              schema:
                type: object
                required: [document]
                properties:
                  document: { type: object, additionalProperties: true }
        "404": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /apps/{app}/maps:
    get:
      tags: [maps]
      summary: Map versions of the site, newest first
      parameters: [{ $ref: "#/components/parameters/app" }]
      responses:
        "200":
          description: Versions, without documents
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/MapVersion" } }
                  next_cursor: { type: [string, "null"] }
    post:
      tags: [maps]
      summary: >-
        New draft version, validated against the map schema and then by a gateway (POST /maps/check on
        EQ_GATEWAY_ADMIN): map_inconsistent (422) when the gateway would refuse it; if no gateway answers the
        draft is saved anyway
      parameters: [{ $ref: "#/components/parameters/app" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [document]
              properties:
                document: { type: object, additionalProperties: true, description: "Map in JSON (schema/map/gateway-map.schema.json); meta.tenant, meta.app, meta.version and meta.status are set by the panel" }
                note: { type: string, maxLength: 2000 }
      responses:
        "201":
          description: Draft created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MapVersion" }
        "422": { $ref: "#/components/responses/Error" }
  /apps/{app}/maps/{version}:
    get:
      tags: [maps]
      summary: Read a map version
      parameters:
        - { $ref: "#/components/parameters/app" }
        - { $ref: "#/components/parameters/version" }
      responses:
        "200":
          description: Version with its document
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MapVersion" }
  /apps/{app}/maps/{version}/review:
    get:
      tags: [maps]
      summary: >-
        Review aid for a version: what changes against the published map and the risks found by fixed rules,
        plus the summary and questions of the tenant's AI model when there is one. It never approves anything
      parameters: [{ $ref: "#/components/parameters/app" }, { $ref: "#/components/parameters/version" }]
      responses:
        "200":
          description: Review
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MapReview" }
    post:
      tags: [maps]
      summary: Ask the AI model again for this version (administrators)
      parameters: [{ $ref: "#/components/parameters/app" }, { $ref: "#/components/parameters/version" }]
      responses:
        "202": { description: Queued }
        "409": { $ref: "#/components/responses/Error" }
  /apps/{app}/maps/{version}/verify:
    get:
      tags: [maps]
      summary: Latest verification of this version (docs/agent.md, steps 4 and 5)
      parameters: [{ $ref: "#/components/parameters/app" }, { $ref: "#/components/parameters/version" }]
      responses:
        "200":
          description: Verification
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Verification" }
        "404": { $ref: "#/components/responses/Error" }
    post:
      tags: [maps]
      summary: >-
        Verify this version (administrators): the agent compares every studied page with
        and without Equalizer using this version, and tries the attack set on every parameter and field, on the
        gateway only. Nothing is written to the legacy site. With test accounts, the pages behind their login are
        verified too (kept encrypted, erased when the verification ends); without, only public pages
      parameters: [{ $ref: "#/components/parameters/app" }, { $ref: "#/components/parameters/version" }]
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                accounts: { type: array, maxItems: 3, items: { $ref: "#/components/schemas/TestAccount" } }
                correct: { type: boolean, default: false, description: "Let the agent correct the version into a new draft" }
      responses:
        "202":
          description: Queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Verification" }
        "409": { $ref: "#/components/responses/Error" }
  /apps/{app}/maps/{version}/{action}:
    post:
      tags: [maps]
      summary: "Lifecycle (administrators, the author included): publish (draft, in_review or approved → published, signed; the previous one and older pending versions are retired); submit, approve and reject are optional steps"
      parameters:
        - { $ref: "#/components/parameters/app" }
        - { $ref: "#/components/parameters/version" }
        - { name: action, in: path, required: true, schema: { enum: [submit, approve, reject, publish, rollback] }, description: "rollback: publish again a retired version that was published before" }
      responses:
        "200":
          description: Version after the action
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MapVersion" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { description: "publish, rollback: map_inconsistent, the gateway would refuse the map", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
        "503": { description: "publish: map_unchecked, no gateway could check the map (never published unchecked)", content: { application/json: { schema: { $ref: "#/components/schemas/Error" } } } }
  /internal/apps/{app}/map:
    get:
      tags: [internal]
      summary: Published map and its signature (used by the gateway)
      security: [{ serviceToken: [] }]
      parameters: [{ $ref: "#/components/parameters/app" }]
      responses:
        "200":
          description: Signed map
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SignedMap" }
        "404": { $ref: "#/components/responses/Error" }
  /internal/maps:
    get:
      tags: [internal]
      summary: >-
        Every published map with its signature (used by the gateway, which serves each one on its
        meta.public_domain). ETag changes when any published version changes
      security: [{ serviceToken: [] }]
      responses:
        "200":
          description: Signed maps
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/SignedMap" } }
        "304": { description: Not modified }
  /internal/connectors:
    get:
      tags: [internal]
      summary: Registered connectors in the relay format (used by tunnel-relay)
      security: [{ serviceToken: [] }]
      responses:
        "200": { $ref: "#/components/responses/Object" }
  /internal/certificates:
    get:
      tags: [internal]
      summary: >-
        Certificates of the published https sites with their private keys in clear, for the gateways to give Caddy
        at TLS handshake (control network only)
      security: [{ serviceToken: [] }]
      responses:
        "200":
          description: Certificates
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [app, domains, chain_pem, key_pem]
                      properties:
                        app: { type: string }
                        domains: { type: array, items: { type: string }, description: "Domains of the site this certificate covers" }
                        chain_pem: { type: string }
                        key_pem: { type: string }
  /internal/oidc:
    get:
      tags: [internal]
      summary: Client secrets of the sites that log in with OIDC, in clear (used by the gateways, control network only)
      security: [{ serviceToken: [] }]
      responses:
        "200":
          description: Secrets
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [app, client_secret]
                      properties:
                        app: { type: string }
                        client_secret: { type: string }
  /apps/{app}/oidc:
    get:
      tags: [apps]
      summary: >-
        What the identity provider needs for this site (addresses to register) and whether a client secret is saved.
        Issuer, client and group → role rules are in the map (roles.auth); OIDC is off until a map turns it on
      parameters: [{ $ref: "#/components/parameters/app" }]
      responses:
        "200":
          description: OIDC settings kept outside the map
          content:
            application/json:
              schema:
                type: object
                required: [redirect_uri, logout_uri, has_secret]
                properties:
                  redirect_uri: { type: string, description: "Register it in the identity provider" }
                  logout_uri: { type: string, description: "Address to allow after logout" }
                  has_secret: { type: boolean }
  /apps/{app}/oidc/secret:
    put:
      tags: [apps]
      summary: Save the client secret (tenant administrators); it is sealed and never returned
      parameters: [{ $ref: "#/components/parameters/app" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [client_secret]
              properties:
                client_secret: { type: string, minLength: 1, maxLength: 1000 }
      responses:
        "204": { description: Saved }
        "403": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
    delete:
      tags: [apps]
      summary: Delete the client secret (public client with PKCE only)
      parameters: [{ $ref: "#/components/parameters/app" }]
      responses:
        "204": { description: Deleted }
        "403": { $ref: "#/components/responses/Error" }
  /tenants/{tenant}/alerts:
    get:
      tags: [alerts]
      summary: "Email alerts of the tenant: a site that stops working (connector offline, legacy site failing, reachable again on its old IP) and its recovery (tenant administrators)"
      parameters: [{ $ref: "#/components/parameters/tenant" }]
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlertSettings" }
    put:
      tags: [alerts]
      summary: Change the email alerts
      parameters: [{ $ref: "#/components/parameters/tenant" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AlertSettings" }
      responses:
        "200":
          description: Settings
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AlertSettings" }
        "422": { $ref: "#/components/responses/Error" }
  /tenants/{tenant}/llm:
    get:
      tags: [llm]
      summary: The tenant's AI model (the key is never returned; tenant administrators). The platform has no AI settings
      parameters: [{ $ref: "#/components/parameters/tenant" }]
      responses:
        "200":
          description: Configuration; provider null when none
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LLMConfig" }
    put:
      tags: [llm]
      summary: Set the tenant's AI model. An empty api_key keeps the saved one
      parameters: [{ $ref: "#/components/parameters/tenant" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LLMConfigUpdate" }
      responses:
        "200":
          description: Configuration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LLMConfig" }
        "422": { $ref: "#/components/responses/Error" }
    delete:
      tags: [llm]
      summary: Remove the tenant's AI model and its key; discovery goes on without AI
      parameters: [{ $ref: "#/components/parameters/tenant" }]
      responses:
        "204": { description: Removed }
  /tenants/{tenant}/llm/models:
    post:
      tags: [llm]
      summary: >-
        The models the provider offers for this key, to choose from a list. An empty api_key uses the saved one when
        the provider is the same. Only the list is read: nothing is sent to the model (tenant administrators)
      parameters: [{ $ref: "#/components/parameters/tenant" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [provider]
              properties:
                provider: { enum: [anthropic, openai, local] }
                endpoint: { type: [string, "null"], maxLength: 300, description: "local: https base URL of the OpenAI-compatible server, e.g. https://llm.example.com/v1; never a private address" }
                api_key: { type: string, writeOnly: true, maxLength: 300 }
      responses:
        "200":
          description: Models, newest first
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      required: [id, name]
                      properties:
                        id: { type: string, description: "What goes in model" }
                        name: { type: string }
        "422": { $ref: "#/components/responses/Error" }
        "502": { $ref: "#/components/responses/Error" }
  /apps/{app}/discoveries:
    get:
      tags: [discovery]
      summary: Discoveries of the site, newest first
      parameters: [{ $ref: "#/components/parameters/app" }]
      responses:
        "200":
          description: Discoveries
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Discovery" } }
    post:
      tags: [discovery]
      summary: >-
        Start a discovery: the agent explores the site through its connector, read-only, and proposes a
        draft map. Without a published map, connector_id and address say how to reach it
        (administrators). 409 while another one is queued or running
      parameters: [{ $ref: "#/components/parameters/app" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DiscoveryStart" }
      responses:
        "201":
          description: Queued
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Discovery" }
        "409": { $ref: "#/components/responses/Error" }
        "422": { $ref: "#/components/responses/Error" }
  /apps/{app}/discoveries/{id}:
    get:
      tags: [discovery]
      summary: One discovery with its report
      parameters: [{ $ref: "#/components/parameters/app" }, { $ref: "#/components/parameters/id" }]
      responses:
        "200":
          description: Discovery
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Discovery" }
        "404": { $ref: "#/components/responses/Error" }
  /internal/discoveries/claim:
    post:
      tags: [internal]
      summary: The agent takes the next queued discovery, with what it needs to run it
      security: [{ serviceToken: [] }]
      responses:
        "200":
          description: Job
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DiscoveryJob" }
        "204": { description: Nothing queued }
  /internal/discoveries/{id}/progress:
    post:
      tags: [internal]
      summary: Pages explored so far
      security: [{ serviceToken: [] }]
      parameters: [{ $ref: "#/components/parameters/id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        "204": { description: Saved }
  /internal/discoveries/{id}/result:
    post:
      tags: [internal]
      summary: >-
        Report and proposed map of a finished discovery. The map is checked like any draft and saved as a
        draft by whoever started the discovery; it still needs someone else's approval
      security: [{ serviceToken: [] }]
      parameters: [{ $ref: "#/components/parameters/id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                report: { type: object, additionalProperties: true }
                document: { type: object, additionalProperties: true }
                error: { type: string, maxLength: 500 }
      responses:
        "204": { description: Saved }
  /internal/verifications/claim:
    post:
      tags: [internal]
      summary: The agent takes the next queued verification, with the version, the pages to compare and the reach
      security: [{ serviceToken: [] }]
      responses:
        "200":
          description: Job
          content:
            application/json:
              schema: { $ref: "#/components/schemas/VerificationJob" }
        "204": { description: Nothing queued }
  /internal/verifications/{id}/try-map:
    post:
      tags: [internal]
      summary: >-
        Sign a corrected version of a running verification for tries on the gateway. Same site, same legacy
        reach, same checks as any draft
      security: [{ serviceToken: [] }]
      parameters: [{ $ref: "#/components/parameters/id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [document]
              properties:
                document: { type: object, additionalProperties: true }
      responses:
        "200":
          description: The document signed for tries
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
        "422": { $ref: "#/components/responses/Error" }
  /internal/verifications/{id}/result:
    post:
      tags: [internal]
      summary: Score and findings of a finished verification
      security: [{ serviceToken: [] }]
      parameters: [{ $ref: "#/components/parameters/id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                score: { $ref: "#/components/schemas/StudyScore" }
                broken: { type: array, maxItems: 500, items: { $ref: "#/components/schemas/BrokenPage" } }
                open: { type: array, maxItems: 1000, items: { $ref: "#/components/schemas/StillOpen" } }
                error: { type: string, maxLength: 500 }
                document:
                  type: [object, "null"]
                  additionalProperties: true
                  description: The corrected version, when the agent changed it; saved as a new draft verified with score
                corrections: { type: array, maxItems: 500, items: { $ref: "#/components/schemas/Correction" } }
                before: { $ref: "#/components/schemas/StudyScore" }
      responses:
        "204": { description: Saved }
  /internal/reviews/claim:
    post:
      tags: [internal]
      summary: The agent takes the next AI review, with the changes, the findings and the tenant's model
      security: [{ serviceToken: [] }]
      responses:
        "200": { $ref: "#/components/responses/Object" }
        "204": { description: Nothing queued }
  /internal/reviews/{id}/result:
    post:
      tags: [internal]
      summary: Summary and questions written by the AI for whoever publishes
      security: [{ serviceToken: [] }]
      parameters: [{ $ref: "#/components/parameters/id" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                summary: { type: string, maxLength: 3000 }
                questions: { type: array, maxItems: 20, items: { type: string, maxLength: 400 } }
                error: { type: string, maxLength: 500 }
      responses:
        "204": { description: Saved }
  /internal/unmapped:
    post:
      tags: [internal]
      summary: >-
        Requests the gateway refused because their path is not in the map, counted per site (path only,
        never the query). Discovery uses them to find what real visitors miss
      security: [{ serviceToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [items]
              properties:
                items:
                  type: array
                  maxItems: 1000
                  items:
                    type: object
                    required: [app, method, path, hits, clients]
                    properties:
                      app: { type: string }
                      method: { type: string }
                      path: { type: string, maxLength: 512 }
                      hits: { type: integer, minimum: 1 }
                      clients: { type: integer, minimum: 1, description: Distinct client addresses (counted, never sent) }
      responses:
        "204": { description: Saved }
  /tenants/{tenant}/connectors:
    get:
      tags: [connectors]
      summary: Connectors of the tenant, one per server, shared by its sites (token never returned; tenant administrators)
      parameters: [{ $ref: "#/components/parameters/tenant" }]
      responses:
        "200":
          description: Connectors
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Connector" } }
                  next_cursor: { type: [string, "null"] }
                  platform_version: { type: string, description: "Release of the platform; connectors older than it are outdated" }
                  relay_url: { type: string, description: "Public address connectors dial (EQ_RELAY_URL in their command); empty when not configured" }
    post:
      tags: [connectors]
      summary: Register a connector; the token is returned only in this answer (tenant administrators)
      parameters: [{ $ref: "#/components/parameters/tenant" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: { type: string, pattern: "^[a-z0-9][a-z0-9_-]{1,62}$", description: "Unique in the installation, e.g. the server's name" }
      responses:
        "201":
          description: Connector and its token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConnectorCreated" }
        "409": { $ref: "#/components/responses/Error" }
  /tenants/{tenant}/connectors/{id}/rotate:
    post:
      tags: [connectors]
      summary: New token; open tunnels with the old one are closed
      parameters: [{ $ref: "#/components/parameters/tenant" }, { $ref: "#/components/parameters/id" }]
      responses:
        "200":
          description: Connector and its new token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConnectorCreated" }
  /tenants/{tenant}/connectors/{id}:
    delete:
      tags: [connectors]
      summary: Remove a connector; its tunnels are closed. 409 while a published map uses it
      parameters: [{ $ref: "#/components/parameters/tenant" }, { $ref: "#/components/parameters/id" }]
      responses:
        "204": { description: Removed }
        "409": { $ref: "#/components/responses/Error" }
  /apps/{app}/capacity:
    get:
      tags: [capacity]
      summary: Desired capacity of the site
      parameters: [{ $ref: "#/components/parameters/app" }]
      responses:
        "200":
          description: Capacity
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Capacity" }
    put:
      tags: [capacity]
      summary: Update capacity (within plan limits)
      parameters: [{ $ref: "#/components/parameters/app" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Capacity" }
      responses:
        "200": { $ref: "#/components/responses/Object" }
        "422": { description: Outside plan limits }
  /capacity/desired:
    get:
      tags: [capacity]
      summary: Desired state of all sites (orchestrator)
      security: [{ serviceToken: [] }]
      responses:
        "200": { $ref: "#/components/responses/List" }
  /capacity/status:
    post:
      tags: [capacity]
      summary: Actual state reported by the orchestrator
      security: [{ serviceToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "204": { description: Received }
  /plans:
    get:
      tags: [capacity]
      summary: Plans and limits (platform administrators)
      responses:
        "200": { $ref: "#/components/responses/List" }
    put:
      tags: [capacity]
      summary: Update plans and limits
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: array, items: { type: object } }
      responses:
        "200": { $ref: "#/components/responses/Object" }
  /apps/{app}/metrics:
    get:
      tags: [metrics]
      summary: Aggregated metrics for the protected site page
      parameters:
        - { $ref: "#/components/parameters/app" }
        - { name: range, in: query, schema: { enum: [1h, 24h, 7d, 30d], default: 24h } }
      responses:
        "200": { $ref: "#/components/responses/Object" }
  /apps/{app}/metrics/top:
    get:
      tags: [metrics]
      summary: Rankings from the event store
      parameters:
        - { $ref: "#/components/parameters/app" }
        - { name: kind, in: query, required: true, schema: { enum: [blocked_paths, blocked_ips, reasons, pages] } }
        - { name: range, in: query, schema: { enum: [1h, 24h, 7d, 30d], default: 24h } }
      responses:
        "200": { $ref: "#/components/responses/List" }
  /heartbeat:
    post:
      tags: [status]
      summary: Service and connector heartbeat
      security: [{ serviceToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Heartbeat" }
      responses:
        "204": { description: Received }
  /status/platform:
    get:
      tags: [status]
      summary: Health of the platform's services (platform users); no tenant data
      responses:
        "200":
          description: Services
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PlatformStatus" }
  /tenants/{tenant}/status:
    get:
      tags: [status]
      summary: >-
        Health of each site of the tenant: published map, connector, legacy application (last 15 minutes),
        isolation, and problems per day over the last 7 days (the tenant's people)
      parameters: [{ $ref: "#/components/parameters/tenant" }]
      responses:
        "200":
          description: Sites
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TenantStatus" }
  /logs:
    get:
      tags: [logs]
      summary: Log search (filtered by tenant)
      parameters:
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: service, in: query, schema: { type: string } }
        - { name: level, in: query, schema: { enum: [debug, info, warn, error] } }
        - { name: app, in: query, schema: { type: string } }
        - { name: request_id, in: query, schema: { type: string } }
        - { name: q, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 200, maximum: 5000 } }
      responses:
        "200": { $ref: "#/components/responses/List" }
  /logs/tail:
    get:
      tags: [logs]
      summary: Live tail (Server-Sent Events) with the same filters
      responses:
        "200":
          description: Stream of log lines
          content:
            text/event-stream:
              schema: { type: string }
  /logs/exports:
    post:
      tags: [logs]
      summary: Export of search results
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                format: { enum: [json, csv] }
                filters: { type: object }
      responses:
        "202": { $ref: "#/components/responses/Object" }
  /log-levels:
    get:
      tags: [logs]
      summary: Active log levels
      responses:
        "200": { $ref: "#/components/responses/List" }
    put:
      tags: [logs]
      summary: Change level per service, module and site, with expiry
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LogLevel" }
      responses:
        "200": { $ref: "#/components/responses/Object" }
  /apps/{app}/request-trace:
    post:
      tags: [logs]
      summary: Enable request tracing for a limited time
      parameters: [{ $ref: "#/components/parameters/app" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [duration_minutes]
              properties:
                duration_minutes: { type: integer, minimum: 1, maximum: 120 }
      responses:
        "200": { $ref: "#/components/responses/Object" }
  /requests/{request_id}:
    get:
      tags: [logs]
      summary: Full path of a request, step by step
      parameters:
        - { name: request_id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/Object" }
  /siem-destinations:
    get:
      tags: [siem]
      summary: Forwarding destinations (platform or tenant)
      responses:
        "200": { $ref: "#/components/responses/List" }
    put:
      tags: [siem]
      summary: Create or update a destination
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SiemDestination" }
      responses:
        "200": { $ref: "#/components/responses/Object" }
  /siem-destinations/{id}/test:
    post:
      tags: [siem]
      summary: Send a test message
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "200": { $ref: "#/components/responses/Object" }
  /exports:
    post:
      tags: [import-export]
      summary: Start a configuration export
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scope]
              properties:
                scope: { enum: [platform, tenant, site] }
                tenant: { type: string }
                app: { type: string }
                include_map_history: { type: boolean, default: false }
      responses:
        "202": { $ref: "#/components/responses/Object" }
  /imports:
    post:
      tags: [import-export]
      summary: Upload an archive and return preview, diff and conflicts
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                archive: { type: string, format: binary }
      responses:
        "200": { $ref: "#/components/responses/Object" }
  /imports/{id}/apply:
    post:
      tags: [import-export]
      summary: Apply the import (maps arrive as proposals)
      parameters: [{ $ref: "#/components/parameters/id" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                conflicts: { type: object, additionalProperties: { enum: [overwrite, skip, rename] } }
      responses:
        "200": { $ref: "#/components/responses/Object" }
  /tenants/{tenant}/logs:
    get:
      tags: [logs]
      summary: >-
        Security events of the tenant's sites, newest first: what the gateway served and refused (tenant
        administrators and viewers; platform users see no tenant's events)
      parameters:
        - { $ref: "#/components/parameters/tenant" }
        - { $ref: "#/components/parameters/logApp" }
        - { $ref: "#/components/parameters/logTypes" }
        - { $ref: "#/components/parameters/logSearch" }
        - { $ref: "#/components/parameters/logSince" }
        - name: before
          in: query
          description: Cursor from next_cursor (older events)
          schema: { type: string, pattern: "^[0-9]{1,20}$" }
      responses:
        "200":
          description: At most 50 events
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/LogEvent" } }
                  next_cursor: { type: [string, "null"] }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /tenants/{tenant}/logs/stats:
    get:
      tags: [logs]
      summary: Events per type and refused requests per interval, for the same filters as the list
      parameters:
        - { $ref: "#/components/parameters/tenant" }
        - { $ref: "#/components/parameters/logApp" }
        - { $ref: "#/components/parameters/logSearch" }
        - { $ref: "#/components/parameters/logSince" }
      responses:
        "200":
          description: Counts
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LogStats" }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /tenants/{tenant}/logs/export:
    get:
      tags: [logs]
      summary: The filtered events as CSV, newest first, at most 10000
      parameters:
        - { $ref: "#/components/parameters/tenant" }
        - { $ref: "#/components/parameters/logApp" }
        - { $ref: "#/components/parameters/logTypes" }
        - { $ref: "#/components/parameters/logSearch" }
        - { $ref: "#/components/parameters/logSince" }
      responses:
        "200":
          description: CSV file
          content:
            text/csv:
              schema: { type: string }
        "422": { $ref: "#/components/responses/Error" }
        "503": { $ref: "#/components/responses/Error" }
  /audit:
    get:
      tags: [audit]
      summary: "Action log: the tenant's for tenant people, the platform's own for platform users"
      responses:
        "200":
          description: Latest entries, newest first
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/AuditEntry" } }
                  next_cursor: { type: [string, "null"] }
components:
  securitySchemes:
    panelSession:
      type: apiKey
      in: cookie
      name: __Host-eq_panel
    oidc:
      type: openIdConnect
      openIdConnectUrl: /.well-known/openid-configuration
    serviceToken:
      type: http
      scheme: bearer
  parameters:
    logApp:
      name: app
      in: query
      description: Only this site
      schema: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,62}$" }
    logTypes:
      name: types
      in: query
      description: Comma-separated event types; empty means all
      schema: { type: string, maxLength: 300 }
    logSearch:
      name: q
      in: query
      description: Text the event must contain (IP address, path, request ID)
      schema: { type: string, maxLength: 200 }
    logSince:
      name: since
      in: query
      schema: { enum: [1h, 24h, 7d, 30d], default: 24h }
    app:
      name: app
      in: path
      required: true
      schema: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,62}$" }
    tenant:
      name: tenant
      in: path
      required: true
      schema: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,62}$" }
    id:
      name: id
      in: path
      required: true
      schema: { type: string }
    version:
      name: version
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Object:
      description: Object
      content:
        application/json:
          schema: { type: object }
    List:
      description: List
      content:
        application/json:
          schema:
            type: object
            properties:
              items: { type: array, items: { type: object } }
              next_cursor: { type: [string, "null"] }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string, description: "Machine-readable reason, e.g. not_found, forbidden, invalid_map" }
        message: { type: string }
        details: { type: array, items: { type: string } }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, maxLength: 254 }
        password: { type: string, maxLength: 256, writeOnly: true }
    User:
      type: object
      properties:
        id: { type: integer }
        email: { type: string }
        name: { type: string }
        platform_role: { type: [string, "null"], enum: [admin, operator, null] }
        tenant: { type: [string, "null"] }
        tenant_role: { type: [string, "null"], enum: [admin, viewer, null] }
        mfa_enabled: { type: boolean, description: "An authenticator app is enrolled" }
        mfa_verified: { type: boolean, description: "Only in /auth/me: this session passed the second step. Without it only /auth/* answers" }
    MfaSetup:
      type: object
      required: [secret, otpauth_uri]
      properties:
        secret: { type: string, description: "Base32, for manual entry" }
        otpauth_uri: { type: string, description: "otpauth://totp/... for the QR code" }
    MfaCode:
      type: object
      required: [code]
      properties:
        code: { type: string, maxLength: 32, description: "6 digits from the app, or a recovery code" }
    RecoveryCodes:
      type: object
      required: [recovery_codes]
      properties:
        recovery_codes: { type: array, items: { type: string } }
    InvitationCreate:
      type: object
      required: [email, name, role]
      properties:
        email: { type: string, maxLength: 254 }
        name: { type: string, maxLength: 200 }
        role: { enum: [admin, viewer], description: "admin: everything; viewer: reads sites, status, activity and logs" }
    Invitation:
      type: object
      required: [id, email, name, role, expires_at]
      properties:
        id: { type: integer }
        email: { type: string }
        name: { type: string }
        role: { enum: [admin, viewer], description: "admin: everything; viewer: reads sites, status, activity and logs" }
        expires_at: { type: string, format: date-time }
        sent: { type: boolean, description: "False when the email could not be sent: revoke and invite again" }
        send_problem:
          description: "Why the email was not sent (only when sent is false): the mail server could not be reached, refused the TLS connection, refused the account or password, refused the sender or the recipient, or refused the message"
          enum: [not_configured, unreachable, tls, auth_rejected, sender_rejected, recipient_rejected, rejected]
    InvitationView:
      type: object
      required: [tenant_name, email, name, role, expires_at]
      properties:
        tenant_name: { type: string }
        email: { type: string }
        name: { type: string }
        role: { enum: [admin, viewer], description: "admin: everything; viewer: reads sites, status, activity and logs" }
        expires_at: { type: string, format: date-time }
    TenantOverview:
      type: object
      required: [id, name, created_at, joined, site_count, sites]
      properties:
        id: { type: string }
        name: { type: string }
        created_at: { type: string, format: date-time }
        joined: { type: boolean, description: "Someone accepted an invitation; before that the platform may invite the first administrator again" }
        pending_admin:
          type: object
          description: "Until someone joins: the name and email the last invitation went to, to invite them again"
          required: [name, email]
          properties:
            name: { type: string }
            email: { type: string }
        site_count: { type: integer }
        sites:
          type: array
          items:
            type: object
            required: [name, status]
            properties:
              name: { type: string }
              status: { enum: [protected, setting_up, exposed], description: "protected: a map is published and the site is not reachable directly; exposed: the exposure check reached it on its old IP" }
    TenantCreate:
      type: object
      required: [id, name, admin_email, admin_name]
      properties:
        id: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,62}$" }
        name: { type: string, maxLength: 200 }
        admin_email: { type: string, maxLength: 254, description: "Receives the invitation to become the tenant's first administrator" }
        admin_name: { type: string, maxLength: 200 }
    AppCreate:
      type: object
      required: [id, name, public_domain]
      properties:
        id: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,62}$" }
        name: { type: string, maxLength: 200 }
        public_domain: { type: string, maxLength: 253 }
        kind: { $ref: "#/components/schemas/SiteKind" }
    SiteKind:
      type: [string, "null"]
      enum: [wordpress, joomla, drupal, magento, prestashop, opencart, typo3, moodle, mediawiki, phpbb, generic, null]
      description: What the site is built with (docs/compatibility.md); selects the template offered for its first map and the agent's profile
    MapTemplate:
      type: object
      required: [id, name, description]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
    Tenant:
      type: object
      required: [id, name, created_at]
      properties:
        id: { type: string }
        name: { type: string }
        created_at: { type: string, format: date-time }
    App:
      type: object
      required: [id, tenant, name, public_domain, created_at, published_version]
      properties:
        id: { type: string }
        tenant: { type: string }
        name: { type: string }
        public_domain: { type: string }
        aliases: { type: array, items: { type: string }, description: "Other domains, redirected to the public domain" }
        created_at: { type: string, format: date-time }
        published_version: { type: [integer, "null"] }
        kind: { $ref: "#/components/schemas/SiteKind" }
        discovery_schedule: { enum: [off, daily, weekly], description: "Continuous discovery: run again and propose what changed" }
        exposure: { $ref: "#/components/schemas/Exposure" }
        tls: { $ref: "#/components/schemas/SiteTLS" }
    SiteTLS:
      type: object
      description: How visitors reach the site and its certificate
      required: [public_scheme, status]
      properties:
        public_scheme: { enum: [https, http] }
        status:
          enum: [ok, missing, incomplete, expiring, expired, not_needed]
          description: "ok; missing: https without a certificate (visitors get no HTTPS); incomplete: it does not cover every domain of the site; expiring: within 30 days; expired; not_needed: http"
        certificate: { oneOf: [{ $ref: "#/components/schemas/Certificate" }, { type: "null" }] }
    Certificate:
      type: object
      required: [subject, issuer, domains, not_before, not_after, fingerprint_sha256, uploaded_at]
      properties:
        subject: { type: string }
        issuer: { type: string }
        domains: { type: array, items: { type: string }, description: "Names the certificate covers (wildcards included)" }
        missing: { type: array, items: { type: string }, description: "Domains of the site it does not cover" }
        not_before: { type: string, format: date-time }
        not_after: { type: string, format: date-time }
        fingerprint_sha256: { type: string }
        uploaded_at: { type: string, format: date-time }
        uploaded_by: { type: string }
    Exposure:
      type: object
      description: Whether the site still answers directly, bypassing Equalizer
      required: [status]
      properties:
        legacy_ip: { type: [string, "null"] }
        status:
          enum: [not_configured, never_public, pending, closed, exposed, error]
          description: "not_configured: no legacy_ip; never_public: the site never had a public address; pending: not checked yet; closed: not reachable directly; exposed: reachable directly; error: the check could not run"
        reason:
          type: [string, "null"]
          description: "Why: refused, timeout, forbidden, default_site (the server answers with another site), answers_https, answers_http, probe_failed"
        checked_at: { type: [string, "null"], format: date-time }
    Connector:
      type: object
      required: [id, tenant, created_at, rotated_at]
      properties:
        id: { type: string }
        tenant: { type: string }
        used_by:
          type: array
          items: { type: string }
          description: Sites whose published map uses this connector
        created_at: { type: string, format: date-time }
        rotated_at: { type: [string, "null"], format: date-time }
        online: { type: boolean, readOnly: true, description: "At least one tunnel open (unknown when the relay does not answer: false)" }
        versions:
          type: array
          readOnly: true
          items: { type: string }
          description: Release of each open tunnel (one per running connector process)
        outdated: { type: boolean, readOnly: true, description: "Older than the platform: update it, some features do not work through it" }
    MapVersion:
      type: object
      required: [app, version, status]
      properties:
        app: { type: string }
        version: { type: integer }
        status: { enum: [draft, in_review, approved, rejected, published, retired] }
        note: { type: string }
        author_id: { type: integer }
        author: { type: string }
        approver_id: { type: [integer, "null"] }
        approver: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        decided_at: { type: [string, "null"], format: date-time }
        published_at: { type: [string, "null"], format: date-time }
        document: { type: object, additionalProperties: true, description: "Only when reading one version" }
        verification:
          anyOf: [{ $ref: "#/components/schemas/Verification" }, { type: "null" }]
          description: Latest verification of this version, when there is one
    LogEvent:
      type: object
      description: A security event, with the fields the panel shows (never field values)
      required: [ts, type]
      properties:
        ts: { type: string, format: date-time }
        type:
          enum: [request.served, request.blocked, field.rejected, ratelimit.hit, behavior.alert, parse.failed, legacy.error, connector.down, exposure.alert]
        reason: { type: [string, "null"] }
        app: { type: [string, "null"] }
        route: { type: [string, "null"], description: Map entry }
        map_version: { type: [integer, "null"] }
        request_id: { type: [string, "null"] }
        src_ip: { type: [string, "null"] }
        method: { type: [string, "null"] }
        path: { type: [string, "null"] }
        status: { type: [integer, "null"] }
        field: { type: [string, "null"], description: Name of the refused field }
    LogStats:
      type: object
      required: [counts, refused, step_seconds]
      properties:
        counts:
          type: object
          description: Events per type in the period
          additionalProperties: { type: integer }
        refused:
          type: array
          description: Refused events (every type but request.served) per interval, oldest first
          items:
            type: object
            required: [ts, count]
            properties:
              ts: { type: string, format: date-time }
              count: { type: integer }
        step_seconds: { type: integer }
    HealthState:
      enum: [ok, degraded, down, unknown, not_used]
      description: "unknown: no data yet (e.g. no traffic); not_used: the site does not need it"
    Check:
      type: object
      required: [name, state]
      properties:
        name: { type: string }
        state: { $ref: "#/components/schemas/HealthState" }
        detail: { type: string }
    SiteStatus:
      type: object
      required: [app, name, public_domain, state, checks, days]
      properties:
        app: { type: string }
        name: { type: string }
        public_domain: { type: string }
        state: { $ref: "#/components/schemas/HealthState" }
        checks: { type: array, items: { $ref: "#/components/schemas/Check" }, description: "Map, Connector, Legacy site, Isolation, Certificate" }
        certificate_expires: { type: string, format: date-time, description: "End of the site's certificate, if it has one" }
        days:
          type: array
          description: Last 7 days, oldest first
          items:
            type: object
            required: [date, legacy_errors, connector_drops]
            properties:
              date: { type: string, format: date }
              legacy_errors: { type: integer }
              connector_drops: { type: integer }
    TenantStatus:
      type: object
      required: [sites, checked_at, logs_available]
      properties:
        sites: { type: array, items: { $ref: "#/components/schemas/SiteStatus" } }
        checked_at: { type: string, format: date-time }
        logs_available: { type: boolean, description: "false: traffic and history are unknown (log store not reachable)" }
    PlatformStatus:
      type: object
      required: [services, checked_at]
      properties:
        services: { type: array, items: { $ref: "#/components/schemas/Check" } }
        checked_at: { type: string, format: date-time }
    AuditEntry:
      type: object
      required: [id, ts, action, target]
      properties:
        id: { type: integer }
        ts: { type: string, format: date-time }
        user_id: { type: [integer, "null"] }
        user: { type: [string, "null"] }
        tenant: { type: [string, "null"] }
        action: { type: string }
        target: { type: string }
        detail: { type: object, additionalProperties: true }
    ConnectorCreated:
      type: object
      required: [id, token]
      properties:
        id: { type: string }
        tenant: { type: string }
        token: { type: string, description: "Shown only once; the panel keeps its SHA-256" }
    SignedMap:
      type: object
      description: |
        Signed document read by the gateway. The signature covers the exact
        payload bytes, so no intermediate step can break it by reformatting
        the JSON.
      required: [version, payload, signature, key_id]
      properties:
        version: { type: integer, description: "Equal to the map's meta.version" }
        payload:
          type: string
          contentEncoding: base64
          description: "Base64 of the compact map JSON (schema/map/gateway-map.schema.json)"
        signature: { type: string, contentEncoding: base64, description: "Ed25519 signature of the payload bytes" }
        key_id: { type: string }
    AlertSettings:
      type: object
      additionalProperties: false
      required: [enabled, extra_emails]
      properties:
        enabled: { type: boolean, description: "Default true: the tenant's administrators get the alerts" }
        extra_emails:
          type: array
          maxItems: 5
          description: More addresses, e.g. the on-call mailbox
          items: { type: string, format: email, maxLength: 254 }
        kinds:
          type: object
          additionalProperties: false
          description: "Which kinds of alert are emailed; a kind left out stays as it was saved (all on by default)"
          properties:
            connector: { type: boolean, description: "The site's connector went offline" }
            legacy_site: { type: boolean, description: "The legacy site fails or does not answer" }
            isolation: { type: boolean, description: "The site answers again on its old IP, bypassing Equalizer" }
            certificate: { type: boolean, description: "The site's certificate is missing or expired" }
            certificate_expiry: { type: boolean, description: "Reminders before the certificate ends (30, 14, 7, 1 days)" }
            recovered: { type: boolean, description: "A problem is over: the site works again" }
        mail_available: { type: boolean, readOnly: true, description: "False when the platform sends no email" }
    LLMConfig:
      type: object
      required: [provider, has_api_key]
      properties:
        provider: { enum: [anthropic, openai, local, null], description: "null: no AI, discovery runs without it" }
        model: { type: [string, "null"], examples: [claude-haiku-5-5] }
        endpoint: { type: [string, "null"], description: "OpenAI-compatible URL, for local models (Ollama, vLLM)" }
        has_api_key: { type: boolean }
    LLMConfigUpdate:
      type: object
      required: [provider, model]
      properties:
        provider: { enum: [anthropic, openai, local] }
        model: { type: string, maxLength: 100 }
        endpoint: { type: [string, "null"], maxLength: 300 }
        api_key: { type: string, writeOnly: true, maxLength: 300 }
    DiscoveryStart:
      type: object
      properties:
        use_ai: { type: boolean, default: true, description: "Ignored when the tenant has no AI model" }
        max_pages: { type: integer, minimum: 10, maximum: 2000, default: 500 }
        account:
          type: [object, "null"]
          description: Test account to explore as a logged-in user; kept encrypted, deleted when the discovery ends
          properties:
            username: { type: string, maxLength: 200 }
            password: { type: string, writeOnly: true, maxLength: 200 }
        accounts:
          type: array
          maxItems: 3
          description: >-
            Test accounts (for example customer and administrator). Each is explored in its own pass, to reach the
            pages behind its login; the map does not restrict pages by account (the legacy site decides access).
            Kept encrypted, deleted when the discovery ends. account counts as the first one
          items: { $ref: "#/components/schemas/TestAccount" }
        connector_id: { type: string, description: "Needed while the site has no published map" }
        address: { type: string, description: "host:port the connector reaches" }
        scheme: { enum: [https, http] }
    Discovery:
      type: object
      required: [id, app, status, created_at]
      properties:
        id: { type: integer }
        app: { type: string }
        status: { enum: [queued, running, done, failed] }
        trigger: { enum: [manual, schedule] }
        use_ai: { type: boolean }
        with_account: { type: boolean }
        requested_by: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        started_at: { type: [string, "null"], format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
        progress: { type: object, additionalProperties: true }
        report:
          anyOf: [{ $ref: "#/components/schemas/StudyReport" }, { type: "null" }]
        draft_version: { type: [integer, "null"], description: "The draft proposed, if the map changes" }
        error: { type: [string, "null"] }
    MapReview:
      type: object
      required: [version, changes, findings, ai]
      properties:
        version: { type: integer }
        base_version: { type: [integer, "null"], description: "The published version compared with; null when none" }
        changes:
          type: array
          items:
            type: object
            required: [section, entry, change]
            properties:
              section: { enum: [legacy, roles, defaults, types, routes, forms, api, assets, behavior, other] }
              entry: { type: string }
              change: { enum: [added, removed, changed] }
              detail: { type: string }
        findings:
          type: array
          items:
            type: object
            required: [severity, entry, message]
            properties:
              severity: { enum: [high, medium, low] }
              entry: { type: string }
              rule: { type: string }
              message: { type: string }
        ai:
          type: object
          required: [status]
          properties:
            status: { enum: [off, queued, running, done, failed] }
            summary: { type: [string, "null"] }
            questions: { type: array, items: { type: string } }
            error: { type: [string, "null"] }
    TestAccount:
      type: object
      required: [label, username, password]
      properties:
        label: { type: string, maxLength: 60, description: "How the report names it, e.g. customer, administrator" }
        username: { type: string, maxLength: 200 }
        password: { type: string, writeOnly: true, maxLength: 200 }
    StudyScore:
      type: object
      description: Measured by the agent's two checks (docs/agent.md)
      required: [functions_total, functions_identical, inputs_total, inputs_protected, area_percent]
      properties:
        functions_total: { type: integer, minimum: 0 }
        functions_identical: { type: integer, minimum: 0, description: "Pages and script requests that look and answer the same with and without Equalizer" }
        inputs_total: { type: integer, minimum: 0, description: "Parameters and form fields of the map" }
        inputs_protected: { type: integer, minimum: 0, description: "Those the gateway refuses every value of the attack set for" }
        area_percent: { type: number, minimum: 0, maximum: 100, description: "Share of the studied requests that only the generic area serves" }
    StudyFunction:
      type: object
      required: [name, entries]
      properties:
        name: { type: string, description: "What the pages do, e.g. Article search" }
        entries: { type: array, items: { type: string }, description: "Map entries (route, form, API ids)" }
        paths: { type: array, items: { type: string } }
        accounts: { type: array, items: { type: string }, description: "Test accounts that reached it (information: the map does not restrict by account)" }
        rule: { type: string, description: "The rule written for it, in words" }
    StillOpen:
      type: object
      required: [kind, target, reason]
      properties:
        kind: { enum: [path, input] }
        target: { type: string, description: "A path left to the area, or entry.field" }
        reason:
          enum: [not_reached, legacy_error, action_not_performed, cannot_narrow, accepts_markup, accepts_sql, accepts_template, accepts_path, accepts_shell, other]
        detail: { type: string }
    BrokenPage:
      type: object
      required: [path, difference]
      properties:
        path: { type: string }
        entry: { type: [string, "null"] }
        difference: { enum: [status, text, links, forms, picture, refused] }
        detail: { type: string }
    StudyReport:
      type: object
      additionalProperties: true
      description: >-
        Report of a discovery. Reports written before the study have only the older keys (cms, coverage, routes
        found and excluded, components with known issues, notes)
      properties:
        score: { $ref: "#/components/schemas/StudyScore" }
        functions: { type: array, items: { $ref: "#/components/schemas/StudyFunction" } }
        open: { type: array, items: { $ref: "#/components/schemas/StillOpen" } }
        accounts: { type: array, items: { type: object, properties: { label: { type: string }, login: { enum: [ok, failed, no_login_form] } } } }
        skipped_actions: { type: array, items: { type: string }, description: "Links never opened because they change something" }
        pages: { type: array, maxItems: 300, items: { type: string }, description: "HTML pages studied anonymously (path and query): what a verification compares" }
        pages_by_account:
          type: object
          additionalProperties: { type: array, maxItems: 150, items: { type: string } }
          description: HTML pages studied with each test account and not anonymously
    Verification:
      type: object
      required: [version, status]
      properties:
        version: { type: integer }
        status: { enum: [queued, running, done, failed] }
        requested_by: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        finished_at: { type: [string, "null"], format: date-time }
        score: { anyOf: [{ $ref: "#/components/schemas/StudyScore" }, { type: "null" }] }
        broken: { type: array, items: { $ref: "#/components/schemas/BrokenPage" } }
        open: { type: array, items: { $ref: "#/components/schemas/StillOpen" } }
        error: { type: [string, "null"] }
        corrected_version: { type: [integer, "null"], description: "The draft the agent made from this version, when it corrected it" }
        corrections: { type: array, items: { $ref: "#/components/schemas/Correction" } }
        before: { anyOf: [{ $ref: "#/components/schemas/StudyScore" }, { type: "null" }], description: "Score of this version before the agent's corrections" }
        accounts: { type: array, items: { type: string }, description: "Test accounts the pages behind a login were verified with" }
    Correction:
      type: object
      required: [entry, change, reason]
      properties:
        entry: { type: string, description: "Map entry, or entry.field" }
        change: { enum: [widened, narrowed, removed, restored] }
        detail: { type: string, description: "From what to what, e.g. int → enum csv, xlsx" }
        reason: { type: string, description: "Why, e.g. the export page was refused" }
    VerificationJob:
      type: object
      required: [id, tenant, app, version, document, reach, base_url, pages, try_map]
      properties:
        id: { type: integer }
        tenant: { type: string }
        app: { type: string }
        version: { type: integer }
        document: { type: object, additionalProperties: true, description: "The version to verify" }
        base_url: { type: string }
        reach: { type: object, additionalProperties: true }
        pages:
          type: array
          items: { type: string }
          description: >-
            Pages studied anonymously by the latest discovery (path and query), to compare; the version's own
            literal routes when there is none. Pages behind a login are not verified (test accounts are erased
            when a discovery ends)
        try_map:
          type: object
          additionalProperties: true
          description: "The version signed for tries on the gateway (TryRequest.map in gateway-admin.yaml), valid one hour"
        kind: { $ref: "#/components/schemas/SiteKind" }
        correct: { type: boolean, description: "Correct the version (widen what breaks, narrow what the observed values allow) and verify again" }
        pages_by_account:
          type: object
          additionalProperties: { type: array, items: { type: string } }
          description: Pages behind each test account's login studied by the latest discovery
        accounts:
          type: array
          items: { type: object, properties: { label: { type: string }, username: { type: string }, password: { type: string } } }
          description: Test accounts to verify the pages behind their login with (erased when the verification ends)
    DiscoveryJob:
      type: object
      required: [id, tenant, app, domain, base_url, reach, max_pages]
      properties:
        id: { type: integer }
        tenant: { type: string }
        app: { type: string }
        domain: { type: string }
        kind: { type: [string, "null"] }
        base_url: { type: string }
        reach: { type: object, additionalProperties: true, description: "legacy.reach for the agent's requests" }
        current_map: { type: [object, "null"], additionalProperties: true, description: "The published map, to propose only differences" }
        template: { type: [object, "null"], additionalProperties: true }
        account: { type: [object, "null"], additionalProperties: true }
        accounts:
          type: array
          items:
            type: object
            required: [label, username, password]
            properties:
              label: { type: string }
              username: { type: string }
              password: { type: string }
        llm: { type: [object, "null"], additionalProperties: true, description: "provider, model, endpoint, api_key; null without AI" }
        max_pages: { type: integer }
        unmapped: { type: array, items: { type: object, additionalProperties: true } }
    Capacity:
      type: object
      properties:
        replicas_min: { type: integer, minimum: 1 }
        replicas_max: { type: integer, minimum: 1 }
        autoscale:
          type: object
          properties:
            cpu_percent: { type: integer, minimum: 10, maximum: 95 }
            rps_per_replica: { type: integer, minimum: 1 }
        pool: { enum: [shared, dedicated] }
        cache_routes: { type: array, items: { type: string } }
        legacy_budget:
          type: object
          properties:
            max_rps: { type: number }
            max_concurrency: { type: integer }
        expected_connectors: { type: integer, minimum: 1 }
        region: { type: string }
    Heartbeat:
      type: object
      required: [service, instance, version, status]
      properties:
        service: { type: string }
        instance: { type: string }
        version: { type: string }
        status: { enum: [operational, degraded, down] }
        reason: { type: string }
        dependencies: { type: object, additionalProperties: { enum: [ok, failing] } }
    LogLevel:
      type: object
      required: [service, level]
      properties:
        service: { type: string }
        module: { type: string }
        app: { type: string }
        level: { enum: [debug, info, warn, error] }
        expires_in_minutes: { type: integer, minimum: 1, maximum: 240 }
    SiemDestination:
      type: object
      required: [name, kind, format, streams]
      properties:
        id: { type: string }
        scope: { enum: [platform, tenant] }
        name: { type: string }
        kind: { enum: [syslog_tls, syslog_tcp, syslog_udp, splunk_hec, sentinel, webhook] }
        address: { type: string }
        format: { enum: [json, cef, leef] }
        streams:
          type: array
          items:
            type: object
            required: [stream]
            properties:
              stream: { enum: [security, audit, application] }
              min_level: { enum: [debug, info, warn, error] }
              facility: { enum: [local0, local1, local2, local3, local4, local5, local6, local7] }
        max_msgs_per_s: { type: integer }
