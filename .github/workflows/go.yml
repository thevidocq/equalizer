name: go

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [gateway, tools]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Formattazione
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Valida docker-compose
        working-directory: deploy/compose
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose --profile tools config --quiet

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build immagine gateway
        run: docker build -t equalizer/gateway:ci gateway
      - name: Build immagine eqtool
        run: docker build -t equalizer/eqtool:ci tools
