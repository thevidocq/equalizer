// Tunnel protocol between connector and tunnel-relay.
// The connector ALWAYS opens the connection to the relay (outbound),
// authenticated with mTLS after enrolment with a one-time token.
syntax = "proto3";

package equalizer.tunnel.v1;

option go_package = "github.com/thevidocq/equalizer/schema/tunnel/gen/tunnelv1";

// Protocol version: relay and connector reject a different major.
message ProtocolVersion {
  uint32 major = 1;
  uint32 minor = 2;
}

// --- Enrolment (once, before mTLS) ---

message EnrollRequest {
  string enroll_token = 1;        // one-time token generated by the panel
  bytes csr_pem = 2;              // connector certificate signing request
  string connector_version = 3;
  string hostname = 4;
}

message EnrollResponse {
  string connector_id = 1;
  bytes certificate_pem = 2;      // client certificate for mTLS
  bytes ca_chain_pem = 3;
  string tenant = 4;
  string app = 5;
}

service Enrollment {
  rpc Enroll(EnrollRequest) returns (EnrollResponse);
}

// --- Tunnel (bidirectional stream, mTLS) ---

service Tunnel {
  // The connector opens the stream; the relay sends requests on it and
  // the connector answers on the same stream.
  rpc Connect(stream ConnectorMessage) returns (stream RelayMessage);
}

// Messages from connector to relay.
message ConnectorMessage {
  oneof kind {
    Hello hello = 1;
    ResponseHead response_head = 2;
    BodyChunk response_body = 3;
    Heartbeat heartbeat = 4;
    RequestError request_error = 5;
  }
}

// Messages from relay to connector.
message RelayMessage {
  oneof kind {
    Welcome welcome = 1;
    RequestHead request_head = 2;
    BodyChunk request_body = 3;
    AllowlistUpdate allowlist = 4;
    Heartbeat heartbeat = 5;
    CancelRequest cancel = 6;
  }
}

message Hello {
  ProtocolVersion protocol = 1;
  string connector_id = 2;
  string connector_version = 3;
  uint64 allowlist_version = 4;   // latest signed allowlist held
}

message Welcome {
  ProtocolVersion protocol = 1;
  string relay_instance = 2;
  uint32 heartbeat_interval_s = 3; // default 10
}

// Destination allowlist, signed by the panel (Ed25519).
// The connector checks the signature with the panel's public key:
// a compromised relay cannot widen it.
message AllowlistUpdate {
  uint64 version = 1;
  repeated string destinations = 2;  // host:port, e.g. "10.20.0.15:8080"
  bytes signature = 3;               // Ed25519 signature of version + destinations
  string key_id = 4;
}

message Header {
  string name = 1;
  string value = 2;
}

// Request already rebuilt by the gateway: the connector does not change it,
// it only checks that the destination is in the allowlist.
message RequestHead {
  string request_id = 1;
  string trace_id = 2;
  string destination = 3;           // host:port, must be in the allowlist
  string scheme = 4;                // http | https
  string method = 5;
  string path_and_query = 6;
  repeated Header headers = 7;      // only headers allowed by the gateway
  bool has_body = 8;
  uint32 timeout_ms = 9;
}

message ResponseHead {
  string request_id = 1;
  uint32 status = 2;
  repeated Header headers = 3;
  bool has_body = 4;
}

message BodyChunk {
  string request_id = 1;
  bytes data = 2;
  bool last = 3;
}

message RequestError {
  string request_id = 1;
  enum Code {
    CODE_UNSPECIFIED = 0;
    DESTINATION_NOT_ALLOWED = 1;
    LEGACY_UNREACHABLE = 2;
    TIMEOUT = 3;
    TOO_LARGE = 4;
    INTERNAL = 5;
  }
  Code code = 2;
  string message = 3;
}

message CancelRequest {
  string request_id = 1;
}

message Heartbeat {
  uint64 unix_ms = 1;
  uint32 inflight = 2;
}
