openapi: 3.1.0
info:
  title: Equalizer panel-api
  version: 0.1.0
  description: |
    Control-plane API. Used by panel-ui (people: panel session cookie) and
    by internal services (service tokens on /internal). Implemented so
    far: auth, tenants, users, apps, connectors, maps, internal, audit.
    The other sections describe planned endpoints and keep brief bodies.

    Every request that changes state must carry the header
    `X-Eq-Panel: 1` (CSRF barrier together with SameSite=Strict cookies).
servers:
  - url: /v1
security:
  - panelSession: []
tags:
  - name: auth
  - name: tenants
  - name: users
  - name: apps
  - name: internal
  - name: maps
  - name: proposals
  - name: crawls
  - name: connectors
  - name: capacity
  - name: llm
  - name: metrics
  - name: status
  - name: logs
  - name: siem
  - name: import-export
  - name: audit
paths:
  /auth/login:
    post:
      tags: [auth]
      summary: Log in with email and password; sets the panel session cookie
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginRequest" }
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Error" }
        "429": { $ref: "#/components/responses/Error" }
  /auth/logout:
    post:
      tags: [auth]
      summary: End the panel session
      responses:
        "204": { description: Logged out }
  /auth/me:
    get:
      tags: [auth]
      summary: The logged-in user
      responses:
        "200":
          description: User
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "401": { $ref: "#/components/responses/Error" }
  /tenants:
    get:
      tags: [tenants]
      summary: Tenants visible to the user (all for platform roles)
      responses:
        "200":
          description: Tenants
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Tenant" } }
                  next_cursor: { type: [string, "null"] }
    post:
      tags: [tenants]
      summary: Create a tenant (platform administrators)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/TenantCreate" }
      responses:
        "201":
          description: Tenant created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Tenant" }
        "409": { $ref: "#/components/responses/Error" }
  /tenants/{tenant}/users:
    get:
      tags: [users]
      summary: Users of a tenant
      parameters: [{ $ref: "#/components/parameters/tenant" }]
      responses:
        "200":
          description: Users
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/User" } }
                  next_cursor: { type: [string, "null"] }
    post:
      tags: [users]
      summary: Create a tenant user (tenant or platform administrators)
      parameters: [{ $ref: "#/components/parameters/tenant" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UserCreate" }
      responses:
        "201":
          description: User created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/User" }
        "409": { $ref: "#/components/responses/Error" }
  /tenants/{tenant}/apps:
    get:
      tags: [apps]
      summary: Protected sites of a tenant
      parameters: [{ $ref: "#/components/parameters/tenant" }]
      responses:
        "200":
          description: Sites
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/App" } }
                  next_cursor: { type: [string, "null"] }
    post:
      tags: [apps]
      summary: Protect a new site
      parameters: [{ $ref: "#/components/parameters/tenant" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AppCreate" }
      responses:
        "201":
          description: Site created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/App" }
        "409": { $ref: "#/components/responses/Error" }
  /apps/{app}:
    get:
      tags: [apps]
      summary: A protected site
      parameters: [{ $ref: "#/components/parameters/app" }]
      responses:
        "200":
          description: Site
          content:
            application/json:
              schema: { $ref: "#/components/schemas/App" }
        "404": { $ref: "#/components/responses/Error" }
  /apps/{app}/maps:
    get:
      tags: [maps]
      summary: Map versions of the site, newest first
      parameters: [{ $ref: "#/components/parameters/app" }]
      responses:
        "200":
          description: Versions, without documents
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/MapVersion" } }
                  next_cursor: { type: [string, "null"] }
    post:
      tags: [maps]
      summary: New draft version (validated against the map schema)
      parameters: [{ $ref: "#/components/parameters/app" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [document]
              properties:
                document: { type: object, additionalProperties: true, description: "Map in JSON (schema/map/gateway-map.schema.json); meta.tenant, meta.app, meta.version and meta.status are set by the panel" }
                note: { type: string, maxLength: 2000 }
      responses:
        "201":
          description: Draft created
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MapVersion" }
        "422": { $ref: "#/components/responses/Error" }
  /apps/{app}/maps/{version}:
    get:
      tags: [maps]
      summary: Read a map version
      parameters:
        - { $ref: "#/components/parameters/app" }
        - { $ref: "#/components/parameters/version" }
      responses:
        "200":
          description: Version with its document
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MapVersion" }
  /apps/{app}/maps/{version}/{action}:
    post:
      tags: [maps]
      summary: "Lifecycle: submit (draft → in_review), approve and reject (never by the author), publish (approved → published, signed; the previous one is retired)"
      parameters:
        - { $ref: "#/components/parameters/app" }
        - { $ref: "#/components/parameters/version" }
        - { name: action, in: path, required: true, schema: { enum: [submit, approve, reject, publish] } }
      responses:
        "200":
          description: Version after the action
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MapVersion" }
        "403": { $ref: "#/components/responses/Error" }
        "409": { $ref: "#/components/responses/Error" }
  /internal/apps/{app}/map:
    get:
      tags: [internal]
      summary: Published map and its signature (used by the gateway)
      security: [{ serviceToken: [] }]
      parameters: [{ $ref: "#/components/parameters/app" }]
      responses:
        "200":
          description: Signed map
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SignedMap" }
        "404": { $ref: "#/components/responses/Error" }
  /internal/connectors:
    get:
      tags: [internal]
      summary: Registered connectors in the relay format (used by tunnel-relay)
      security: [{ serviceToken: [] }]
      responses:
        "200": { $ref: "#/components/responses/Object" }
  /apps/{app}/proposals:
    get:
      tags: [proposals]
      summary: Proposal queue
      parameters: [{ $ref: "#/components/parameters/app" }]
      responses:
        "200": { $ref: "#/components/responses/List" }
    post:
      tags: [proposals]
      summary: New change proposal (agent or import)
      security: [{ serviceToken: [] }, { oidc: [] }]
      parameters: [{ $ref: "#/components/parameters/app" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Proposal" }
      responses:
        "201": { $ref: "#/components/responses/Object" }
  /proposals/{id}/approve:
    post:
      tags: [proposals]
      summary: Approve a proposal (never by its author)
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "200": { $ref: "#/components/responses/Object" }
        "403": { description: The author cannot approve their own proposal }
  /proposals/{id}/reject:
    post:
      tags: [proposals]
      summary: Reject a proposal
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "200": { $ref: "#/components/responses/Object" }
  /apps/{app}/crawls:
    post:
      tags: [crawls]
      summary: Start a crawl
      parameters: [{ $ref: "#/components/parameters/app" }]
      responses:
        "202": { $ref: "#/components/responses/Object" }
  /crawls/next:
    get:
      tags: [crawls]
      summary: The agent takes the next queued job
      security: [{ serviceToken: [] }]
      responses:
        "200": { $ref: "#/components/responses/Object" }
        "204": { description: No job queued }
  /tenants/{tenant}/llm:
    get:
      tags: [llm]
      summary: Tenant LLM provider configuration (keys never returned)
      parameters: [{ $ref: "#/components/parameters/tenant" }]
      responses:
        "200":
          description: Configuration
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LLMConfig" }
    put:
      tags: [llm]
      summary: Update the LLM configuration
      parameters: [{ $ref: "#/components/parameters/tenant" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LLMConfigUpdate" }
      responses:
        "200": { $ref: "#/components/responses/Object" }
  /tenants/{tenant}/llm/test:
    post:
      tags: [llm]
      summary: Test the connection to the provider
      parameters: [{ $ref: "#/components/parameters/tenant" }]
      responses:
        "200": { $ref: "#/components/responses/Object" }
  /agent/llm-config:
    get:
      tags: [llm]
      summary: Effective LLM configuration for the agent
      security: [{ serviceToken: [] }]
      responses:
        "200": { $ref: "#/components/responses/Object" }
  /apps/{app}/connectors:
    get:
      tags: [connectors]
      summary: Connectors of the site (token never returned)
      parameters: [{ $ref: "#/components/parameters/app" }]
      responses:
        "200":
          description: Connectors
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/Connector" } }
                  next_cursor: { type: [string, "null"] }
    post:
      tags: [connectors]
      summary: Register a connector; the token is returned only in this answer
      parameters: [{ $ref: "#/components/parameters/app" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [id]
              properties:
                id: { type: string, pattern: "^[a-z0-9][a-z0-9_-]{1,62}$" }
      responses:
        "201":
          description: Connector and its token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConnectorCreated" }
        "409": { $ref: "#/components/responses/Error" }
  /apps/{app}/connectors/{id}/rotate:
    post:
      tags: [connectors]
      summary: New token; open tunnels with the old one are closed
      parameters: [{ $ref: "#/components/parameters/app" }, { $ref: "#/components/parameters/id" }]
      responses:
        "200":
          description: Connector and its new token
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConnectorCreated" }
  /apps/{app}/connectors/{id}:
    delete:
      tags: [connectors]
      summary: Remove a connector; its tunnels are closed
      parameters: [{ $ref: "#/components/parameters/app" }, { $ref: "#/components/parameters/id" }]
      responses:
        "204": { description: Removed }
  /apps/{app}/capacity:
    get:
      tags: [capacity]
      summary: Desired capacity of the site
      parameters: [{ $ref: "#/components/parameters/app" }]
      responses:
        "200":
          description: Capacity
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Capacity" }
    put:
      tags: [capacity]
      summary: Update capacity (within plan limits)
      parameters: [{ $ref: "#/components/parameters/app" }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Capacity" }
      responses:
        "200": { $ref: "#/components/responses/Object" }
        "422": { description: Outside plan limits }
  /capacity/desired:
    get:
      tags: [capacity]
      summary: Desired state of all sites (orchestrator)
      security: [{ serviceToken: [] }]
      responses:
        "200": { $ref: "#/components/responses/List" }
  /capacity/status:
    post:
      tags: [capacity]
      summary: Actual state reported by the orchestrator
      security: [{ serviceToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        "204": { description: Received }
  /plans:
    get:
      tags: [capacity]
      summary: Plans and limits (platform administrators)
      responses:
        "200": { $ref: "#/components/responses/List" }
    put:
      tags: [capacity]
      summary: Update plans and limits
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: array, items: { type: object } }
      responses:
        "200": { $ref: "#/components/responses/Object" }
  /apps/{app}/metrics:
    get:
      tags: [metrics]
      summary: Aggregated metrics for the protected site page
      parameters:
        - { $ref: "#/components/parameters/app" }
        - { name: range, in: query, schema: { enum: [1h, 24h, 7d, 30d], default: 24h } }
      responses:
        "200": { $ref: "#/components/responses/Object" }
  /apps/{app}/metrics/top:
    get:
      tags: [metrics]
      summary: Rankings from the event store
      parameters:
        - { $ref: "#/components/parameters/app" }
        - { name: kind, in: query, required: true, schema: { enum: [blocked_paths, blocked_ips, reasons, pages] } }
        - { name: range, in: query, schema: { enum: [1h, 24h, 7d, 30d], default: 24h } }
      responses:
        "200": { $ref: "#/components/responses/List" }
  /heartbeat:
    post:
      tags: [status]
      summary: Service and connector heartbeat
      security: [{ serviceToken: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/Heartbeat" }
      responses:
        "204": { description: Received }
  /status/platform:
    get:
      tags: [status]
      summary: Global health (platform administrators)
      responses:
        "200": { $ref: "#/components/responses/Object" }
  /tenants/{tenant}/status:
    get:
      tags: [status]
      summary: Health of the tenant's sites and shared services
      parameters: [{ $ref: "#/components/parameters/tenant" }]
      responses:
        "200": { $ref: "#/components/responses/Object" }
  /logs:
    get:
      tags: [logs]
      summary: Log search (filtered by tenant)
      parameters:
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: service, in: query, schema: { type: string } }
        - { name: level, in: query, schema: { enum: [debug, info, warn, error] } }
        - { name: app, in: query, schema: { type: string } }
        - { name: request_id, in: query, schema: { type: string } }
        - { name: q, in: query, schema: { type: string } }
        - { name: limit, in: query, schema: { type: integer, default: 200, maximum: 5000 } }
      responses:
        "200": { $ref: "#/components/responses/List" }
  /logs/tail:
    get:
      tags: [logs]
      summary: Live tail (Server-Sent Events) with the same filters
      responses:
        "200":
          description: Stream of log lines
          content:
            text/event-stream:
              schema: { type: string }
  /logs/exports:
    post:
      tags: [logs]
      summary: Export of search results
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                format: { enum: [json, csv] }
                filters: { type: object }
      responses:
        "202": { $ref: "#/components/responses/Object" }
  /log-levels:
    get:
      tags: [logs]
      summary: Active log levels
      responses:
        "200": { $ref: "#/components/responses/List" }
    put:
      tags: [logs]
      summary: Change level per service, module and site, with expiry
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LogLevel" }
      responses:
        "200": { $ref: "#/components/responses/Object" }
  /apps/{app}/request-trace:
    post:
      tags: [logs]
      summary: Enable request tracing for a limited time
      parameters: [{ $ref: "#/components/parameters/app" }]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [duration_minutes]
              properties:
                duration_minutes: { type: integer, minimum: 1, maximum: 120 }
      responses:
        "200": { $ref: "#/components/responses/Object" }
  /requests/{request_id}:
    get:
      tags: [logs]
      summary: Full path of a request, step by step
      parameters:
        - { name: request_id, in: path, required: true, schema: { type: string } }
      responses:
        "200": { $ref: "#/components/responses/Object" }
  /siem-destinations:
    get:
      tags: [siem]
      summary: Forwarding destinations (platform or tenant)
      responses:
        "200": { $ref: "#/components/responses/List" }
    put:
      tags: [siem]
      summary: Create or update a destination
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SiemDestination" }
      responses:
        "200": { $ref: "#/components/responses/Object" }
  /siem-destinations/{id}/test:
    post:
      tags: [siem]
      summary: Send a test message
      parameters: [{ $ref: "#/components/parameters/id" }]
      responses:
        "200": { $ref: "#/components/responses/Object" }
  /exports:
    post:
      tags: [import-export]
      summary: Start a configuration export
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scope]
              properties:
                scope: { enum: [platform, tenant, site] }
                tenant: { type: string }
                app: { type: string }
                include_map_history: { type: boolean, default: false }
      responses:
        "202": { $ref: "#/components/responses/Object" }
  /imports:
    post:
      tags: [import-export]
      summary: Upload an archive and return preview, diff and conflicts
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                archive: { type: string, format: binary }
      responses:
        "200": { $ref: "#/components/responses/Object" }
  /imports/{id}/apply:
    post:
      tags: [import-export]
      summary: Apply the import (maps arrive as proposals)
      parameters: [{ $ref: "#/components/parameters/id" }]
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                conflicts: { type: object, additionalProperties: { enum: [overwrite, skip, rename] } }
      responses:
        "200": { $ref: "#/components/responses/Object" }
  /audit:
    get:
      tags: [audit]
      summary: Action log
      parameters:
        - { name: tenant, in: query, required: false, schema: { type: string }, description: "Platform users only: restrict to one tenant" }
      responses:
        "200":
          description: Latest entries, newest first
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items: { type: array, items: { $ref: "#/components/schemas/AuditEntry" } }
                  next_cursor: { type: [string, "null"] }
components:
  securitySchemes:
    panelSession:
      type: apiKey
      in: cookie
      name: __Host-eq_panel
    oidc:
      type: openIdConnect
      openIdConnectUrl: /.well-known/openid-configuration
    serviceToken:
      type: http
      scheme: bearer
  parameters:
    app:
      name: app
      in: path
      required: true
      schema: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,62}$" }
    tenant:
      name: tenant
      in: path
      required: true
      schema: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,62}$" }
    id:
      name: id
      in: path
      required: true
      schema: { type: string }
    version:
      name: version
      in: path
      required: true
      schema: { type: integer, minimum: 1 }
  responses:
    Error:
      description: Error
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Object:
      description: Object
      content:
        application/json:
          schema: { type: object }
    List:
      description: List
      content:
        application/json:
          schema:
            type: object
            properties:
              items: { type: array, items: { type: object } }
              next_cursor: { type: [string, "null"] }
  schemas:
    Error:
      type: object
      required: [error]
      properties:
        error: { type: string, description: "Machine-readable reason, e.g. not_found, forbidden, invalid_map" }
        message: { type: string }
        details: { type: array, items: { type: string } }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, maxLength: 254 }
        password: { type: string, maxLength: 256, writeOnly: true }
    User:
      type: object
      properties:
        id: { type: integer }
        email: { type: string }
        name: { type: string }
        platform_role: { type: [string, "null"], enum: [admin, operator, null] }
        tenant: { type: [string, "null"] }
        tenant_role: { type: [string, "null"], enum: [admin, editor, approver, auditor, null] }
    UserCreate:
      type: object
      required: [email, name, password, role]
      properties:
        email: { type: string, maxLength: 254 }
        name: { type: string, maxLength: 200 }
        password: { type: string, minLength: 12, maxLength: 256, writeOnly: true }
        role: { enum: [admin, editor, approver, auditor] }
    TenantCreate:
      type: object
      required: [id, name]
      properties:
        id: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,62}$" }
        name: { type: string, maxLength: 200 }
    AppCreate:
      type: object
      required: [id, name, public_domain]
      properties:
        id: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,62}$" }
        name: { type: string, maxLength: 200 }
        public_domain: { type: string, maxLength: 253 }
    Tenant:
      type: object
      required: [id, name, created_at]
      properties:
        id: { type: string }
        name: { type: string }
        created_at: { type: string, format: date-time }
    App:
      type: object
      required: [id, tenant, name, public_domain, created_at, published_version]
      properties:
        id: { type: string }
        tenant: { type: string }
        name: { type: string }
        public_domain: { type: string }
        created_at: { type: string, format: date-time }
        published_version: { type: [integer, "null"] }
    Connector:
      type: object
      required: [id, app, tenant, created_at, rotated_at]
      properties:
        id: { type: string }
        app: { type: string }
        tenant: { type: string }
        created_at: { type: string, format: date-time }
        rotated_at: { type: [string, "null"], format: date-time }
    MapVersion:
      type: object
      required: [app, version, status]
      properties:
        app: { type: string }
        version: { type: integer }
        status: { enum: [draft, in_review, approved, rejected, published, retired] }
        note: { type: string }
        author_id: { type: integer }
        author: { type: string }
        approver_id: { type: [integer, "null"] }
        approver: { type: [string, "null"] }
        created_at: { type: string, format: date-time }
        decided_at: { type: [string, "null"], format: date-time }
        published_at: { type: [string, "null"], format: date-time }
        document: { type: object, additionalProperties: true, description: "Only when reading one version" }
    AuditEntry:
      type: object
      required: [id, ts, action, target]
      properties:
        id: { type: integer }
        ts: { type: string, format: date-time }
        user_id: { type: [integer, "null"] }
        user: { type: [string, "null"] }
        tenant: { type: [string, "null"] }
        action: { type: string }
        target: { type: string }
        detail: { type: object, additionalProperties: true }
    ConnectorCreated:
      type: object
      required: [id, token]
      properties:
        id: { type: string }
        app: { type: string }
        token: { type: string, description: "Shown only once; the panel keeps its SHA-256" }
    SignedMap:
      type: object
      description: |
        Signed document read by the gateway. The signature covers the exact
        payload bytes, so no intermediate step can break it by reformatting
        the JSON.
      required: [version, payload, signature, key_id]
      properties:
        version: { type: integer, description: "Equal to the map's meta.version" }
        payload:
          type: string
          contentEncoding: base64
          description: "Base64 of the compact map JSON (schema/map/gateway-map.schema.json)"
        signature: { type: string, contentEncoding: base64, description: "Ed25519 signature of the payload bytes" }
        key_id: { type: string }
    Proposal:
      type: object
      required: [base_version, changes, author]
      properties:
        base_version: { type: integer }
        changes: { type: array, items: { type: object } }
        author: { type: string, description: "agent:<run> or user:<id>" }
        rationale: { type: string }
    LLMConfig:
      type: object
      properties:
        provider: { enum: [anthropic, openai, local] }
        model: { type: string, examples: [claude-haiku-5-5] }
        endpoint: { type: [string, "null"], description: Local provider only }
        has_api_key: { type: boolean }
        timeout_s: { type: integer }
        max_tokens: { type: integer }
        retries: { type: integer }
        fallback_provider: { type: [string, "null"] }
        mask_personal_data: { type: boolean }
    LLMConfigUpdate:
      allOf:
        - { $ref: "#/components/schemas/LLMConfig" }
        - type: object
          properties:
            api_key: { type: string, writeOnly: true }
    Capacity:
      type: object
      properties:
        replicas_min: { type: integer, minimum: 1 }
        replicas_max: { type: integer, minimum: 1 }
        autoscale:
          type: object
          properties:
            cpu_percent: { type: integer, minimum: 10, maximum: 95 }
            rps_per_replica: { type: integer, minimum: 1 }
        pool: { enum: [shared, dedicated] }
        cache_routes: { type: array, items: { type: string } }
        legacy_budget:
          type: object
          properties:
            max_rps: { type: number }
            max_concurrency: { type: integer }
        expected_connectors: { type: integer, minimum: 1 }
        region: { type: string }
    Heartbeat:
      type: object
      required: [service, instance, version, status]
      properties:
        service: { type: string }
        instance: { type: string }
        version: { type: string }
        status: { enum: [operational, degraded, down] }
        reason: { type: string }
        dependencies: { type: object, additionalProperties: { enum: [ok, failing] } }
    LogLevel:
      type: object
      required: [service, level]
      properties:
        service: { type: string }
        module: { type: string }
        app: { type: string }
        level: { enum: [debug, info, warn, error] }
        expires_in_minutes: { type: integer, minimum: 1, maximum: 240 }
    SiemDestination:
      type: object
      required: [name, kind, format, streams]
      properties:
        id: { type: string }
        scope: { enum: [platform, tenant] }
        name: { type: string }
        kind: { enum: [syslog_tls, syslog_tcp, syslog_udp, splunk_hec, sentinel, webhook] }
        address: { type: string }
        format: { enum: [json, cef, leef] }
        streams:
          type: array
          items:
            type: object
            required: [stream]
            properties:
              stream: { enum: [security, audit, application] }
              min_level: { enum: [debug, info, warn, error] }
              facility: { enum: [local0, local1, local2, local3, local4, local5, local6, local7] }
        max_msgs_per_s: { type: integer }
