name: contracts

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa dipendenze
        run: pip install jsonschema pyyaml openapi-spec-validator grpcio-tools

      - name: Valida JSON Schema, esempi di mappa e OpenAPI
        run: python scripts/validate_schemas.py

      - name: Compila il protocollo del tunnel
        run: |
          mkdir -p /tmp/proto-out
          python -m grpc_tools.protoc -I schema/tunnel --python_out=/tmp/proto-out schema/tunnel/tunnel.proto

      - name: Il changelog deve cambiare in ogni PR
        if: github.event_name == 'pull_request'
        run: |
          git fetch --depth=1 origin "${{ github.base_ref }}"
          if git diff --quiet "origin/${{ github.base_ref }}" -- CHANGELOG.md; then
            echo "CHANGELOG.md non aggiornato: aggiungi una voce per questa modifica." >&2
            exit 1
          fi
