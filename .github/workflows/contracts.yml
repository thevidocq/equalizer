name: contracts

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install jsonschema pyyaml openapi-spec-validator

      - name: Validate JSON Schema, map examples and OpenAPI
        run: python scripts/validate_schemas.py

      # Dependabot's version bumps carry no changelog entry: they are
      # recorded in the release notes instead.
      - name: The changelog must change in every PR
        if: github.event_name == 'pull_request' && github.event.pull_request.user.login != 'dependabot[bot]'
        run: |
          git fetch --depth=1 origin "${{ github.base_ref }}"
          if git diff --quiet "origin/${{ github.base_ref }}" -- CHANGELOG.md; then
            echo "CHANGELOG.md not updated: add an entry for this change." >&2
            exit 1
          fi
