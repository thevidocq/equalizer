name: go

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        module: [gateway, tunnel-relay, connector, panel-api, tools, lab/e2e]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Formatting
        run: test -z "$(gofmt -l .)" || (gofmt -l . && exit 1)

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race ./...

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate docker-compose
        working-directory: deploy/compose
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose --profile tools config --quiet

  images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build gateway image
        run: docker build -t equalizer/gateway:ci gateway
      - name: Build tunnel-relay image
        run: docker build -t equalizer/tunnel-relay:ci tunnel-relay
      - name: Build connector image
        run: docker build -t equalizer/connector:ci connector
      - name: Build panel-api image
        run: docker build -t equalizer/panel-api:ci panel-api
      - name: Build panel-ui image
        run: docker build -t equalizer/panel-ui:ci panel-ui
      - name: Build eqtool image
        run: docker build -t equalizer/eqtool:ci tools
