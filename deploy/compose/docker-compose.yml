# Equalizer — prototype on a VPS.
# Networks:
#   edge     exposed: edge proxy (Caddy) and tunnel-relay (behind Caddy)
#   control  internal: gateway, observability, panel (later)
#   lab      internal, with no way out to the Internet: test apps
# Start: docker compose up -d   (see INSTALL.md)

name: equalizer

networks:
  edge: {}
  control: {}
  lab:
    internal: true

volumes:
  caddy-data: {}
  postgres-data: {}
  loki-data: {}
  grafana-data: {}
  vector-data: {}

x-collect: &collect
  labels:
    eq.collect: "true"

# Services that read files in ./secrets run as the VPS user that owns them
# (the files are created 0600 by eqtool).
x-owner: &owner "${EQ_UID:-1000}:${EQ_GID:-1000}"

services:
  caddy:
    image: caddy:2.8
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      EQ_RELAY_DOMAIN: ${EQ_RELAY_DOMAIN:?set EQ_RELAY_DOMAIN in .env}
      EQ_PANEL_DOMAIN: ${EQ_PANEL_DOMAIN:?set EQ_PANEL_DOMAIN in .env}
      EQ_ACME_EMAIL: ${EQ_ACME_EMAIL:-}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    networks: [edge]
    depends_on: [gateway, tunnel-relay]

  gateway:
    <<: *collect
    build:
      context: ../../gateway
      args:
        VERSION: ${EQ_VERSION:-dev}
    restart: unless-stopped
    user: *owner
    deploy:
      replicas: ${EQ_GATEWAY_REPLICAS:-2}
    environment:
      EQ_PUBLIC_ADDR: ":8080"
      EQ_ADMIN_ADDR: ":9090"
      EQ_LOG_LEVEL: ${EQ_LOG_LEVEL:-info}
      # Every published map comes from the panel; each is served on its own
      # domain. EQ_MAP_URL= (empty) in .env: maps/current.json, signed by
      # hand with eqtool.
      EQ_MAP_URL: ${EQ_MAP_URL-http://panel-api:8080/v1/internal/maps}
      EQ_MAP_TOKEN_FILE: /secrets/panel-internal.token
      EQ_MAP_FILE: /maps/current.json
      EQ_MAP_PUBKEY_FILE: /secrets/map-signing.pub
      EQ_MAP_KEY_ID: ${EQ_MAP_KEY_ID:-k1}
      # shared by every replica: a form rendered by one is accepted by the others
      EQ_FORM_KEY_FILE: /secrets/form.key
      # connector mode: requests go to tunnel-relay on the control network
      EQ_RELAY_URL: http://tunnel-relay:8082
      EQ_RELAY_TOKEN_FILE: /secrets/relay.token
      # sessions shared by the replicas (legacy cookies, role after login)
      EQ_REDIS_URL: redis://redis:6379/0
      # edge network: only Caddy may state the client IP
      EQ_TRUSTED_PROXIES: ${EQ_TRUSTED_PROXIES:-172.16.0.0/12}
      EQ_BEHIND_CLOUDFLARE: ${EQ_BEHIND_CLOUDFLARE:-false}
    volumes:
      - ./maps:/maps:ro
      - ./secrets/map-signing.pub:/secrets/map-signing.pub:ro
      - ./secrets/form.key:/secrets/form.key:ro
      - ./secrets/relay.token:/secrets/relay.token:ro
      - ./secrets/panel-internal.token:/secrets/panel-internal.token:ro
    networks: [edge, control]
    depends_on: [redis]

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: equalizer
      POSTGRES_DB: equalizer
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres.password
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./secrets/postgres.password:/run/secrets/postgres.password:ro
    networks: [control]
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "equalizer"]
      interval: 10s
      timeout: 5s
      retries: 5

  panel-api:
    <<: *collect
    build:
      context: ../../panel-api
      args:
        VERSION: ${EQ_VERSION:-dev}
    restart: unless-stopped
    user: *owner
    environment:
      EQ_ADDR: ":8080"
      # Caddy and panel-ui in front (private Docker networks) give the visitor's
      # address in X-Forwarded-For.
      EQ_TRUSTED_PROXIES: ${EQ_TRUSTED_PROXIES:-172.16.0.0/12}
      EQ_ADMIN_ADDR: ":9092"
      EQ_LOG_LEVEL: ${EQ_LOG_LEVEL:-info}
      EQ_DATABASE_URL: postgres://equalizer@postgres:5432/equalizer?sslmode=disable
      EQ_DATABASE_PASSWORD_FILE: /secrets/postgres.password
      EQ_MAP_SIGNING_KEY_FILE: /secrets/map-signing.key
      EQ_MAP_KEY_ID: ${EQ_MAP_KEY_ID:-k1}
      EQ_INTERNAL_TOKEN_FILE: /secrets/panel-internal.token
      # encrypts the panel users' authenticator secrets
      EQ_MFA_KEY_FILE: /secrets/mfa.key
      # invitation emails: links point to the panel's public address
      EQ_PANEL_URL: https://${EQ_PANEL_DOMAIN}
      EQ_MAIL_MODE: ${EQ_MAIL_MODE:-smtp}
      EQ_SMTP_ADDR: ${EQ_SMTP_ADDR:-}
      EQ_SMTP_USER: ${EQ_SMTP_USER:-}
      EQ_SMTP_PASSWORD_FILE: /secrets/smtp.password
      EQ_MAIL_FROM: ${EQ_MAIL_FROM:-}
      # host:port a map may reach in direct mode (lab apps); empty: tenant
      # maps must use a connector, never the platform's own network
      EQ_DIRECT_DESTINATIONS: ${EQ_DIRECT_DESTINATIONS:-}
      # how often each protected site is checked for direct exposure
      EQ_EXPOSURE_INTERVAL: ${EQ_EXPOSURE_INTERVAL:-1h}
      # Logs page: security events read from Loki (control network)
      EQ_LOKI_URL: http://loki:3100
      # Status page: every replica of relay and gateway, found through DNS
      EQ_RELAY_ADMIN: tunnel-relay:9091
      EQ_GATEWAY_ADMIN: gateway:9090
    volumes:
      - ./secrets/mfa.key:/secrets/mfa.key:ro
      - ./secrets/smtp.password:/secrets/smtp.password:ro
      - ./secrets/postgres.password:/secrets/postgres.password:ro
      - ./secrets/map-signing.key:/secrets/map-signing.key:ro
      - ./secrets/panel-internal.token:/secrets/panel-internal.token:ro
    networks: [control]
    depends_on:
      postgres:
        condition: service_healthy

  panel-ui:
    build: ../../panel-ui
    restart: unless-stopped
    environment:
      EQ_PANEL_API: panel-api:8080
    # Customers reach it through Caddy on EQ_PANEL_DOMAIN; the localhost port
    # is for the platform team over an SSH tunnel or VPN.
    ports:
      - "127.0.0.1:8088:8080"
    networks: [control, edge]
    depends_on: [panel-api]

  # Discovery: explores the sites read-only through their connector (as the
  # gateway does) and proposes draft maps. AI calls go to each tenant's own
  # provider, with the tenant's key.
  agent:
    <<: *collect
    build:
      context: ../../agent
      args:
        VERSION: ${EQ_VERSION:-dev}
    restart: unless-stopped
    user: *owner
    environment:
      EQ_PANEL_URL: http://panel-api:8080
      EQ_INTERNAL_TOKEN_FILE: /secrets/panel-internal.token
      EQ_RELAY_URL: http://tunnel-relay:8082
      EQ_RELAY_TOKEN_FILE: /secrets/relay.token
      EQ_DIRECT_DESTINATIONS: ${EQ_DIRECT_DESTINATIONS:-}
      EQ_RATE: ${EQ_DISCOVERY_RATE:-2}
      EQ_LOG_LEVEL: ${EQ_LOG_LEVEL:-info}
    volumes:
      - ./secrets/panel-internal.token:/secrets/panel-internal.token:ro
      - ./secrets/relay.token:/secrets/relay.token:ro
    networks: [control]
    depends_on: [panel-api, tunnel-relay]

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    # Sessions only: no persistence, memory bounded, every key has a TTL.
    command: ["redis-server", "--save", "", "--appendonly", "no", "--maxmemory", "256mb", "--maxmemory-policy", "volatile-lru"]
    networks: [control]

  tunnel-relay:
    <<: *collect
    build:
      context: ../../tunnel-relay
      args:
        VERSION: ${EQ_VERSION:-dev}
    restart: unless-stopped
    user: *owner
    # A tunnel lives on one replica; a request that reaches another one is
    # handed over to it (replicas found through DNS, EQ_PEERS).
    deploy:
      replicas: ${EQ_RELAY_REPLICAS:-2}
    environment:
      EQ_PEERS: tunnel-relay
      EQ_TUNNEL_ADDR: ":8081"
      EQ_INTERNAL_ADDR: ":8082"
      EQ_ADMIN_ADDR: ":9091"
      EQ_LOG_LEVEL: ${EQ_LOG_LEVEL:-info}
      # Connectors registered in the panel.
      EQ_CONNECTORS_URL: http://panel-api:8080/v1/internal/connectors
      EQ_PANEL_TOKEN_FILE: /secrets/panel-internal.token
      EQ_GATEWAY_TOKEN_FILE: /secrets/relay.token
    volumes:
      - ./secrets/relay.token:/secrets/relay.token:ro
      - ./secrets/panel-internal.token:/secrets/panel-internal.token:ro
    # edge: Caddy brings the connectors' tunnels; control: the gateway calls it
    networks: [edge, control]

  loki:
    image: grafana/loki:3.1.1
    restart: unless-stopped
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./loki/config.yaml:/etc/loki/config.yaml:ro
      - loki-data:/loki
    networks: [control]

  vector:
    image: timberio/vector:0.40.1-alpine
    restart: unless-stopped
    command: ["--config", "/etc/vector/vector.yaml"]
    volumes:
      - ./vector/vector.yaml:/etc/vector/vector.yaml:ro
      # read-only: Vector reads logs of containers labelled eq.collect
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - vector-data:/var/lib/vector
    networks: [control]
    depends_on: [loki]

  grafana:
    image: grafana/grafana:11.2.0
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${EQ_GRAFANA_PASSWORD:?set EQ_GRAFANA_PASSWORD in .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
    # VPS localhost only: reach it over an SSH tunnel or VPN
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    networks: [control]
    depends_on: [loki]

  eqtool:
    build: ../../tools
    profiles: [tools]
    # writes files as the VPS user, not as root
    user: "${EQ_UID:-1000}:${EQ_GID:-1000}"
    volumes:
      - ./:/work
    network_mode: none
