# Vector collects JSON logs from containers labelled eq.collect=true,
# splits them into the "security" stream (events, with a schema field) and the
# "application" stream (logs) and sends them to Loki. SIEM forwarding will be
# configured from the panel.

data_dir: /var/lib/vector

sources:
  docker:
    type: docker_logs
    include_labels:
      - "eq.collect=true"

transforms:
  parsed:
    type: remap
    inputs: [docker]
    source: |
      parsed, err = parse_json(.message)
      if err == null && is_object(parsed) {
        . = merge(., object!(parsed))
        del(.message)
      } else {
        .msg = .message
        del(.message)
      }
      if exists(.schema) {
        .stream = "security"
      } else {
        .stream = "application"
      }
      if !exists(.service) {
        .service = .container_name
      }
      if !exists(.level) {
        .level = "info"
      }
      del(.label)

sinks:
  loki:
    type: loki
    inputs: [parsed]
    endpoint: http://loki:3100
    encoding:
      codec: json
    # low-cardinality labels: everything else is searched in the content
    labels:
      service: "{{ service }}"
      stream: "{{ stream }}"
      level: "{{ level }}"
    out_of_order_action: accept
    buffer:
      type: disk
      max_size: 268435488
      when_full: block
